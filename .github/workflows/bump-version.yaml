name: Bump Chart Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (semver)'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - prerelease
          - stable

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    name: Bump version, run pre-commit, open PR
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      # Required by the helmlint pre-commit hook
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.2

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Install helm-docs
        run: |
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz" \
            | tar -xz helm-docs
          sudo mv helm-docs /usr/local/bin/helm-docs

      - name: Install helm-values-schema-json plugin
        run: helm plugin install https://github.com/losisin/helm-values-schema-json --version v2.3.1 --verify=false

      - name: Compute and apply new version
        id: bump
        env:
          BUMP_KIND: ${{ inputs.bump }}
        run: |
          python3 scripts/bump-version.py --bump "$BUMP_KIND" > "$RUNNER_TEMP/version.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'version.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in result.items():
                  output.write(key + '=' + value + '\n')
          PY

      - name: Run pre-commit hooks
        # Hooks like helm-docs and helm-schema regenerate README/schema and exit 1
        # on first run because they modified files. The changes are committed below.
        run: pre-commit run --all-files || pre-commit run --all-files

      - name: Configure Git
        run: |
          git config user.name "pihole-helm[bot]"
          git config user.email "265114218+pihole-helm[bot]@users.noreply.github.com"

      - name: Commit and push branch
        run: |
          BRANCH="bump/v${{ steps.bump.outputs.new_version }}"
          git checkout -b "$BRANCH"
          git add --all
          git commit -m "chore: bump chart version to ${{ steps.bump.outputs.new_version }}"
          git push origin "$BRANCH"

      - name: Open Pull Request
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          CURRENT: ${{ steps.bump.outputs.current }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          BUMP: ${{ inputs.bump }}
        run: |
          pr_body_file=$(mktemp)
          trap 'rm -f "$pr_body_file"' EXIT
          printf 'Bumps chart version from %s to %s.\n\n**Bump type:** %s\n\n---\nAfter merging, the chart will be automatically linted, tested, and released.\n' \
            "$CURRENT" "$NEW_VERSION" "$BUMP" > "$pr_body_file"
          gh pr create \
            --title "chore: bump chart version ${CURRENT} → ${NEW_VERSION}" \
            --body-file "$pr_body_file" \
            --base main \
            --head "bump/v${NEW_VERSION}" \
            --label release
