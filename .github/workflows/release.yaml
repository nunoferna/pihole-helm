name: Release Charts

on:
  workflow_dispatch:
    inputs:
      tested-run-id:
        description: Successful main push run of Lint and Test Charts to publish
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'nunoferna/pihole-helm'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
      pages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TESTED_RUN_ID: ${{ inputs.tested-run-id }}
    steps:
      - name: Validate the successful full test run
        id: source
        run: |
          [[ "$TESTED_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN_ID" > "$RUNNER_TEMP/test-run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'test-run.json').read_text())
          expected = {'conclusion': 'success', 'status': 'completed', 'event': 'push', 'head_branch': 'main', 'path': '.github/workflows/lint-test.yaml'}
          if any(run.get(key) != value for key, value in expected.items()):
              raise SystemExit('Release requires a successful complete main-push certification run')
          if run['repository']['full_name'] != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('Test run belongs to another repository')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + run['head_sha'] + '\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.2
      - name: Prepare Python
        run: |
          python3 -m venv /tmp/pihole-ci-python
          /tmp/pihole-ci-python/bin/pip install PyYAML==6.0.3
          echo /tmp/pihole-ci-python/bin >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-chart
          path: ${{ runner.temp }}/tested-chart
          run-id: ${{ inputs.tested-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact tested bytes
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/package-chart.py --output "$RUNNER_TEMP/tested-chart" --verify-only --expected-source "$SOURCE_SHA"
      - name: Sign existing archive without repackaging
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/pihole-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$PGP_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$PGP_PASSPHRASE" > "$RUNNER_TEMP/pgp-passphrase"
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr" {print $10; exit}')
          test -n "$fingerprint"
          gpg --batch --export "$fingerprint" > "$RUNNER_TEMP/pihole-public.gpg"
          gpg --batch --armor --export "$fingerprint" > "$RUNNER_TEMP/tested-chart/pihole-signing-key.asc"
          python3 scripts/package-chart.py --output "$RUNNER_TEMP/tested-chart" --sign-key "$fingerprint" --passphrase-file "$RUNNER_TEMP/pgp-passphrase" --keyring "$RUNNER_TEMP/pihole-public.gpg"
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resume each publication destination independently
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: >-
          python3 scripts/publish-chart.py --directory "$RUNNER_TEMP/tested-chart"
          --repo "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA"
          --keyring "$RUNNER_TEMP/pihole-public.gpg" --execute
      - name: Remove signing material
        if: always()
        run: |
          GNUPGHOME="$RUNNER_TEMP/pihole-gnupg" gpgconf --kill gpg-agent || true
          rm -f "$RUNNER_TEMP/pgp-passphrase"
          rm -rf "$RUNNER_TEMP/pihole-gnupg"
