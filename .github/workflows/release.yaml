name: Release Charts

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - "Chart.yaml"
      - "values.yaml"
      - "templates/**"

jobs:
  release:
    if: github.repository == 'nunoferna/pihole-helm'
    permissions:
      contents: write # to push chart release and create a release
      packages: write # to push OCI chart package to GitHub Registry
      id-token: write # needed for keyless signing

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Install helm-sigstore plugin
        run: |
          helm plugin install https://github.com/sigstore/helm-sigstore --verify=false

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_existing: true
          charts_dir: .
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_GENERATE_RELEASE_NOTES: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and sign charts to GHCR with Sigstore
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            if [ -z "${pkg:-}" ]; then
              break
            fi
            # Extract chart name and version from package filename
            # Format: chartname-version.tgz
            pkg_file=$(basename "${pkg}")
            pkg_name="${pkg_file%-*}"
            pkg_version="${pkg_file#*-}"
            pkg_version="${pkg_version%.tgz}"
            
            # Push chart to OCI registry
            helm push "${pkg}" oci://ghcr.io/${{ github.repository_owner }}/charts
            
            # Sign OCI chart with Cosign (keyless signing)
            cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/${pkg_name}:${pkg_version}"
          done
