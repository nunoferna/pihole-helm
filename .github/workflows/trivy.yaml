name: Security release gate

on:
  workflow_call:
    inputs:
      tested-artifact:
        type: boolean
        default: false
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      TRIVY_CHECKS_BUNDLE_REPOSITORY: ghcr.io/aquasecurity/trivy-checks:1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.2
      - name: Prepare Python and pinned scanner
        run: |
          python3 -m venv /tmp/pihole-ci-python
          /tmp/pihole-ci-python/bin/pip install PyYAML==6.0.3
          echo /tmp/pihole-ci-python/bin >> "$GITHUB_PATH"
          curl -fL --retry 3 --output "$RUNNER_TEMP/trivy.tar.gz" https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.tested-artifact
        with:
          name: tested-chart
          path: ${{ runner.temp }}/tested-chart
      - name: Verify tested archive
        if: inputs.tested-artifact
        run: |
          python3 scripts/package-chart.py --output "$RUNNER_TEMP/tested-chart" --verify-only --expected-source "$GITHUB_SHA"
          tar -xzf "$RUNNER_TEMP"/tested-chart/*.tgz -C "$RUNNER_TEMP/tested-chart"
      - name: Fail on actionable manifest or image findings
        env:
          TESTED_ARTIFACT: ${{ inputs.tested-artifact }}
        run: |
          chart=charts/pihole
          if [ "$TESTED_ARTIFACT" = true ]; then
            archives=("$RUNNER_TEMP"/tested-chart/*.tgz)
            test "${#archives[@]}" -eq 1
            chart="${archives[0]}"
          fi
          python3 scripts/validation/security-gate.py --trivy "$RUNNER_TEMP/trivy" --chart "$chart" --reports "$RUNNER_TEMP/security-reports" --output "$RUNNER_TEMP/security-summary.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-evidence
          overwrite: true
          path: |
            ${{ runner.temp }}/security-reports/*.json
            ${{ runner.temp }}/security-summary.json
          if-no-files-found: error
