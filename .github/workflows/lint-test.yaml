name: Lint and Test Charts

permissions:
  contents: read

on:
  pull_request:
    paths: ['charts/**', 'scripts/**', 'examples/**', '.github/**']
  push:
    branches: [main]
    paths: ['charts/**', 'scripts/**', 'examples/**', '.github/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.2
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - name: Prepare Python
        run: |
          python3 -m venv /tmp/pihole-ci-python
          /tmp/pihole-ci-python/bin/pip install PyYAML==6.0.3
          echo /tmp/pihole-ci-python/bin >> "$GITHUB_PATH"
      - name: Contract, signature and security-exception regressions
        run: python3 -m unittest discover -s scripts/validation -p 'test_*.py' -v
      - name: Lint the exact chart
        run: ct lint --debug --config .github/configs/ct.yaml --charts charts/pihole
      - name: Build once
        run: python3 scripts/package-chart.py --output "$RUNNER_TEMP/tested-chart" --require-clean
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-chart
          path: ${{ runner.temp }}/tested-chart/*
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        helm: [v3.22.1, v4.3.2]
        kubernetes:
          - version: v1.35.8
            image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - version: v1.36.4
            image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - version: v1.37.0
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: ${{ matrix.helm }}
      - name: Prepare Python
        run: |
          python3 -m venv /tmp/pihole-ci-python
          /tmp/pihole-ci-python/bin/pip install PyYAML==6.0.3
          echo /tmp/pihole-ci-python/bin >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-chart
          path: ${{ runner.temp }}/tested-chart
      - name: Verify the archive
        run: |
          python3 scripts/package-chart.py --output "$RUNNER_TEMP/tested-chart" --verify-only --expected-source "$GITHUB_SHA"
          tar -xzf "$RUNNER_TEMP"/tested-chart/*.tgz -C "$RUNNER_TEMP/tested-chart"
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: pihole-ci
          kubeconfig: /tmp/pihole-ci.kubeconfig
          node_image: ${{ matrix.kubernetes.image }}
          kubectl_version: ${{ matrix.kubernetes.version }}
          wait: 120s
      - name: Full policy lifecycle, HTTPS snapshot and functional tests
        env:
          KUBECONFIG: /tmp/pihole-ci.kubeconfig
        run: >-
          python3 scripts/validation/policy-runtime.py --context kind-pihole-ci
          --chart "$RUNNER_TEMP"/tested-chart/*.tgz
          --upgrade-from docs/validation/baselines/2026.10.0.json
          --output "$RUNNER_TEMP/runtime.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-${{ matrix.runner }}-${{ matrix.helm }}-${{ matrix.kubernetes.version }}
          overwrite: true
          path: ${{ runner.temp }}/runtime.json
          if-no-files-found: error

  security:
    needs: build
    uses: ./.github/workflows/trivy.yaml
    with:
      tested-artifact: true

  ha-recovery:
    needs: build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.2
      - name: Prepare Python and pinned age
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=1048576
          python3 -m venv /tmp/pihole-ci-python
          /tmp/pihole-ci-python/bin/pip install PyYAML==6.0.3
          echo /tmp/pihole-ci-python/bin >> "$GITHUB_PATH"
          curl -fL --retry 3 --output "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-arm64.tar.gz
          echo "6b8dc4333c53a5a57c9e5834e3a48f92605d7154014cd07269ff3327db5d37f4  $RUNNER_TEMP/age.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-chart
          path: ${{ runner.temp }}/tested-chart
      - name: Verify the archive
        run: |
          python3 scripts/package-chart.py --output "$RUNNER_TEMP/tested-chart" --verify-only --expected-source "$GITHUB_SHA"
          tar -xzf "$RUNNER_TEMP"/tested-chart/*.tgz -C "$RUNNER_TEMP/tested-chart"
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: pihole-ha-ci
          config: .github/configs/kind-ha.yaml
          kubeconfig: /tmp/pihole-ha-ci.kubeconfig
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          kubectl_version: v1.37.3
          wait: 120s
      - name: Install digest-pinned disposable MetalLB
        env:
          KUBECONFIG: /tmp/pihole-ha-ci.kubeconfig
        run: |
          curl -fL --retry 3 --output "$RUNNER_TEMP/metallb.yaml" https://raw.githubusercontent.com/metallb/metallb/v0.16.2/config/manifests/metallb-native.yaml
          echo "e5f7c268f114c446dc60aaad71b7cabf861f637743e033e354d7d48592807c6d  $RUNNER_TEMP/metallb.yaml" | sha256sum --check
          sed -i 's@quay.io/metallb/controller:v0.16.2@quay.io/metallb/controller:v0.16.2\@sha256:34a6f107f29c4fc6e9d084a7f3bdb781aae7b5ee2b534195a2775ab68c09c503@g' "$RUNNER_TEMP/metallb.yaml"
          sed -i 's@quay.io/metallb/speaker:v0.16.2@quay.io/metallb/speaker:v0.16.2\@sha256:01666518b091a6651d68891c802db84b2219495d7e0e41c2e61c46f9976be231@g' "$RUNNER_TEMP/metallb.yaml"
          kubectl --context kind-pihole-ha-ci apply -f "$RUNNER_TEMP/metallb.yaml"
      - name: Generic VIP failure, bounded load and encrypted restore
        run: >-
          python3 scripts/validation/ha-runtime.py --context kind-pihole-ha-ci
          --kubeconfig /tmp/pihole-ha-ci.kubeconfig --docker-context default
          --cluster-name pihole-ha-ci --chart "$RUNNER_TEMP"/tested-chart/*.tgz
          --output "$RUNNER_TEMP/ha-recovery.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ha-recovery-evidence
          overwrite: true
          path: ${{ runner.temp }}/ha-recovery.json
          if-no-files-found: error
