# Example configuration using External Secrets Operator (ESO)
# This is the modern, recommended approach for integrating with Vault and other secret providers
#
# Prerequisites:
# 1. External Secrets Operator installed in the cluster
#    helm repo add external-secrets https://charts.external-secrets.io
#    helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace
#
# 2. SecretStore or ClusterSecretStore configured for your provider (Vault, AWS, GCP, Azure, etc.)
# 3. Secret stored in your external provider
#
# Example Vault SecretStore (apply before installing this chart):
#   apiVersion: external-secrets.io/v1beta1
#   kind: SecretStore
#   metadata:
#     name: vault-backend
#     namespace: default
#   spec:
#     provider:
#       vault:
#         server: "https://vault.example.com:8200"
#         path: "secret"
#         version: "v2"
#         auth:
#           kubernetes:
#             mountPath: "kubernetes"
#             role: "pihole"
#             serviceAccountRef:
#               name: "pihole"
#
# Example ExternalSecret (apply before installing this chart):
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata:
#     name: pihole-web-password
#     namespace: default
#   spec:
#     refreshInterval: 1h
#     secretStoreRef:
#       name: vault-backend
#       kind: SecretStore
#     target:
#       name: pihole-web-password
#       creationPolicy: Owner
#     data:
#       - secretKey: password
#         remoteRef:
#           key: pihole/web-password
#           property: password
#
# The ExternalSecret will automatically create a Kubernetes secret named "pihole-web-password"
# which this chart will reference using existingSecret

pihole:
  web:
    # Reference the secret created by External Secrets Operator
    existingSecret: "pihole-web-password"
    passwordSecretKey: "password"

# Ensure service account is created for authentication
serviceAccount:
  create: true
  name: "pihole"
  annotations: {}
