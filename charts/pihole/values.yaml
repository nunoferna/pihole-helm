serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}

# @schema type:string
# -- (string) Kubernetes cluster domain. Override only if your cluster uses a non-default DNS domain.
# @default -- "cluster.local"
clusterDomain: "cluster.local"

networking:
  hostNetwork: false
  # -- Explicit bootstrap DNS policy, or empty for ClusterFirst/ClusterFirstWithHostNet.
  dnsPolicy: ""
  dnsConfig: {}
  hostAliases: []

persistence:
  retentionPolicy:
    # @schema enum:[Retain, Delete]
    whenDeleted: Retain
    # @schema enum:[Retain, Delete]
    whenScaled: Retain
  etcPihole:
    enabled: true
    accessMode: ReadWriteOnce
    # -- Initial per-replica claim size; plan expansion and history retention separately.
    size: 1Gi
    # storageClassName: "" # Leave empty to use the cluster default StorageClass
  # By default, Pi-hole v6 no longer reads configuration files from /etc/dnsmasq.d/. Read: https://docs.pi-hole.net/docker/upgrading/v5-v6/?h=dnsmasq#custom-dnsmasq-config-files
  etcDnsmasq:
    enabled: false
    accessMode: ReadWriteOnce
    size: 100Mi
    # storageClassName: "" # Leave empty to use the cluster default StorageClass

metrics:
  # @schema type:boolean,null
  # -- (boolean) Whether to enable the Pi-hole metrics exporter. Provides Prometheus metrics on port 9617. Required for any metrics-related features (ServiceMonitor, Grafana dashboards, etc.).
  # @section -- Metrics
  enabled: false
  image:
    # @schema type:string,null
    # -- (string) Container image for the Pi-hole metrics exporter.
    # @section -- Metrics
    repository: ekofr/pihole-exporter
    tag: v1.3.1
    allowUnverified: false
    digest: "sha256:4233c06fcd2d62c37b9345228bc9f798b3a66d052b4955ec6a0e5b8825e20827"
    pullPolicy: IfNotPresent
  # @schema type:integer,null
  # -- (integer) Port on which the metrics exporter will listen.
  # @section -- Metrics
  port: 9617
  service:
    # @schema type:boolean,null
    # -- (boolean) Metrics Kubernetes Service. Required for external access to metrics endpoint. (port 9617)
    # @section -- K8S Services
    enabled: true
    # @schema enum:[ClusterIP, NodePort, LoadBalancer]
    type: ClusterIP
    # externalTrafficPolicy: Local # Defined only for LoadBalancer/NodePort types
    # annotations: {}
    # loadBalancerIP: ""
    # externalIPs: []
    # nodePort: 30617
  # @schema type:array,null
  # -- (array) Additional exporter variables. Scrape timing is controlled by Prometheus.
  # Authentication uses the Pi-hole Secret unless PIHOLE_PASSWORD or PIHOLE_PASSWORD_FILE is supplied here.
  env: []
  podAnnotations: {}
  # @schema type:string,null
  # -- (string) PriorityClass for the metrics exporter pod. Separate from the DNS
  # priorityClassName so the exporter does not inherit resolver-level priority.
  # @section -- Metrics
  priorityClassName: ""
  affinity: {}
  nodeSelector: {}
  tolerations: []
  # Override metrics container command (optional)
  command: []
  # Override metrics container args (optional)
  args: []
  # @schema type:object,null
  # -- (object) Pod security context for the metrics exporter. Defaults follow Pod Security Standards Restricted controls where compatible.
  # @section -- Metrics
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # @schema type:object,null
  # -- (object) Container security context for the metrics exporter. Defaults follow Pod Security Standards Restricted controls.
  # @section -- Metrics
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      memory: 64Mi
      cpu: 50m
    requests:
      memory: 32Mi
      cpu: 10m
  serviceMonitor:
    # @schema type:boolean,null
    # -- (boolean) Whether to create a ServiceMonitor resource for Prometheus Operator integration.
    # @section -- Metrics
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
    relabelings: []
    metricRelabelings: []
  dashboards:
    # @schema type:boolean,null
    # -- (boolean) Whether to create Grafana dashboard resources for the Pi-hole metrics exporter. Requires metrics.service.enabled to be true.
    # @section -- Metrics
    enabled: false
    # Label for Grafana dashboard sidecar discovery
    # For kube-prometheus-stack, use: grafana_dashboard
    label: "grafana_dashboard"
    labelValue: "1"
    annotations: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
    # -- Stock-image startup needs ownership, identity/capability setup and child-process shutdown. DHCP adds its network capabilities separately.
    add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, SETPCAP, SETFCAP, KILL]
  readOnlyRootFilesystem: false

networkPolicy:
  enabled: false
  # -- Enable explicit DNS/exporter egress policies. Requires enabled=true; empty rules deny egress.
  egressEnabled: false
  # -- DNS-pod egress rules. Include bootstrap DNS, intended upstreams and approved HTTPS mirror destinations.
  egress: []
  # -- Exporter egress rules. Include bootstrap DNS and HTTP access to this release's DNS pods.
  metricsEgress: []
  # -- Permit release-labelled Helm test and synthetic DNS pods. Disable to supply your own validation policy.
  allowTests: true
  dnsAllowFrom: []  # Empty permits all DNS clients
  webAllowFrom: []  # Empty denies inbound web access when policy is enabled
  metricsAllowFrom: []  # Empty denies inbound exporter access when policy is enabled

podDisruptionBudget:
  enabled: false
  minAvailable: 1

resources:
  limits:
    memory: 512Mi
    cpu: "1"
  requests:
    memory: 128Mi
    cpu: 100m

topologySpreadConstraints: []
# @schema type:string,null
# -- (string) PriorityClass for the DNS pods. Raises their scheduling priority so a
# cluster-critical resolver is placed ahead of, and preempts, lower-priority workloads
# under node pressure. Empty leaves the namespace or cluster default in place.
priorityClassName: ""
affinity: {}
nodeSelector: {}
tolerations: []

# Extra volumes to add to the pod (optional)
extraVolumes: []
# -- Additional DNS-container mounts, for example a read-only Secret containing a TLS PEM file.
extraVolumeMounts: []

# -- Kubernetes Services are independent of the native FTL configuration tree.
services:
  dns:
    # @schema type:boolean,null
    # -- (boolean) DNS Kubernetes Service. Required for external access to DNS functionality (port 53).
    # @section -- K8S Services
    # @default -- true
    enabled: true
    # Split mode creates separate services for TCP and UDP
    # Set to true for advanced use cases (different IPs, types per protocol)
    # Default false keeps both protocols in one service (standard DNS behavior)
    # @schema type:boolean,null
    # -- (boolean) Whether to create separate Kubernetes Services for TCP and UDP DNS ports.
    # @section -- K8S Services
    # @default -- false
    splitTcpUdp: false

    # Combined service configuration (used when splitTcpUdp: false)
    # @schema enum:[ClusterIP, NodePort, LoadBalancer]
    type: ClusterIP
    # -- Optional provider class; immutable after the LoadBalancer Service is created.
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
    # @schema enum:[Local, Cluster]
    externalTrafficPolicy: Local  # Defined only for LoadBalancer/NodePort types
    annotations: {}
    ports:
      tcp: 53
      udp: 53
    # loadBalancerIP: ""
    # externalIPs: []
    nodePorts: {}  # Optional tcp/udp NodePorts

    # TCP-specific service (used when splitTcpUdp: true)
    tcp:
      enabled: true
      # @schema enum:[ClusterIP, NodePort, LoadBalancer]
      type: ClusterIP
      loadBalancerClass: ""
      loadBalancerSourceRanges: []
      # @schema enum:[Local, Cluster]
      externalTrafficPolicy: Local
      annotations: {}
      port: 53
      # loadBalancerIP: ""
      # externalIPs: []

    # UDP-specific service (used when splitTcpUdp: true)
    udp:
      enabled: true
      # @schema enum:[ClusterIP, NodePort, LoadBalancer]
      type: ClusterIP
      loadBalancerClass: ""
      loadBalancerSourceRanges: []
      # @schema enum:[Local, Cluster]
      externalTrafficPolicy: Local
      annotations: {}
      port: 53
      # loadBalancerIP: ""
      # externalIPs: []

  web:
    # @schema type:boolean,null
    # -- (boolean) Web Kubernetes Service. Required for external access to the Pi-hole web interface. (port 80/443)
    # @section -- K8S Services
    enabled: true
    # @schema enum:[ClusterIP, NodePort, LoadBalancer]
    type: ClusterIP
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
    # @schema enum:[Local, Cluster]
    externalTrafficPolicy: Local  # Defined only for LoadBalancer/NodePort types
    annotations: {}
    ports:
      http: 80
      https: 443
    # loadBalancerIP: ""
    # externalIPs: []
    nodePorts: {}  # Optional http/https NodePorts; omitted ports are assigned by Kubernetes

  dhcp:
    # @schema type:boolean,null
    # -- (boolean) DHCP Kubernetes Service. Required for external access to DHCP functionality (port 67).
    # @section -- K8S Services
    # @default -- false
    enabled: false
    # @schema enum:[ClusterIP, NodePort, LoadBalancer]
    type: LoadBalancer
    # @schema enum:[Local, Cluster]
    externalTrafficPolicy: Local  # Defined only for LoadBalancer/NodePort types
    annotations: {}
    ports:
      dhcp: 67
    # loadBalancerIP: ""
    # externalIPs: []
    # nodePort: 30067

  dhcpv6:
    # @schema type:boolean,null
    # -- (boolean) DHCPv6 Kubernetes Service. Required for external access to DHCPv6 functionality (port 547).
    # @section -- K8S Services
    # @default -- false
    enabled: false
    # @schema enum:[ClusterIP, NodePort, LoadBalancer]
    type: LoadBalancer
    # @schema enum:[Local, Cluster]
    externalTrafficPolicy: Local  # Defined only for LoadBalancer/NodePort types
    annotations: {}
    ports:
      dhcpv6: 547
    # loadBalancerIP: ""
    # externalIPs: []
    # nodePort: 30547

  ntp:
    # @schema type:boolean,null
    # -- (boolean) NTP Kubernetes Service. Required for external access to NTP functionality (port 123).
    # @section -- K8S Services
    # @default -- false
    enabled: false
    # @schema enum:[ClusterIP, NodePort, LoadBalancer]
    type: LoadBalancer
    # @schema enum:[Local, Cluster]
    externalTrafficPolicy: Local  # Defined only for LoadBalancer/NodePort types
    annotations: {}
    ports:
      ntp: 123
      # loadBalancerIP: ""
      # externalIPs: []
       # nodePort: 30123
