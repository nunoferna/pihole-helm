  # additionalPackages: ""           # Additional Alpine packages to install
  # verbose: 0                       # Enable verbose startup scripts (0 or 1)

# ------------------------------------------------------------------------------
# SERVICE ACCOUNT
# ------------------------------------------------------------------------------
serviceAccount:
  create: true
  name: "pihole"
  annotations: {}

# ------------------------------------------------------------------------------
# NETWORKING
# ------------------------------------------------------------------------------
networking:
  hostNetwork: false

# ------------------------------------------------------------------------------
# SERVICES
# ------------------------------------------------------------------------------
serviceDns:
  enabled: true
  # Split mode creates separate services for TCP and UDP
  # Set to true for advanced use cases (different IPs, types per protocol)
  # Default false keeps both protocols in one service (standard DNS behavior)
  splitTcpUdp: false
  
  # Combined service configuration (used when splitTcpUdp: false)
  type: LoadBalancer
  externalTrafficPolicy: Local # Defined only for LoadBalancer/NodePort types
  annotations: {}
  ports:
    tcp: 53
    udp: 53
  # loadBalancerIP: ""
  # externalIPs: []
  # nodePorts:
  #   tcp: 30053
  #   udp: 30054
  
  # TCP-specific service (used when splitTcpUdp: true)
  tcp:
    enabled: true
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations: {}
    port: 53
    # loadBalancerIP: ""
    # externalIPs: []
  
  # UDP-specific service (used when splitTcpUdp: true)
  udp:
    enabled: true
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations: {}
    port: 53
    # loadBalancerIP: ""
    # externalIPs: []

serviceWeb:
  enabled: true
  type: ClusterIP
  externalTrafficPolicy: Local # Defined only for LoadBalancer/NodePort types
  annotations: {}
  ports:
    http: 80
    https: 443
  # loadBalancerIP: ""
  # externalIPs: []
  # nodePorts:
  #   http: 30080
  #   https: 30443

serviceDhcp:
  enabled: false
  type: LoadBalancer
  externalTrafficPolicy: Local # Defined only for LoadBalancer/NodePort types
  annotations: {}
  ports:
    dhcp: 67
  # loadBalancerIP: ""
  # externalIPs: []
  # nodePort: 30067

# ------------------------------------------------------------------------------
# PERSISTENCE
# ------------------------------------------------------------------------------
persistence:
  etcPihole:
    enabled: true
    accessMode: ReadWriteOnce
    size: 500Mi
  # By default, Pi-hole v6 no longer reads configuration files from /etc/dnsmasq.d/. Read: https://docs.pi-hole.net/docker/upgrading/v5-v6/?h=dnsmasq#custom-dnsmasq-config-files
  etcDnsmasq:
    enabled: false
    accessMode: ReadWriteOnce
    size: 100Mi

# ------------------------------------------------------------------------------
# METRICS
# ------------------------------------------------------------------------------
metrics:
  enabled: false
  image:
    repository: ekofr/pihole-exporter
    tag: v1.2.0
    pullPolicy: IfNotPresent
  port: 9617
  service:
    enabled: true
    type: ClusterIP
    # externalTrafficPolicy: Local # Defined only for LoadBalancer/NodePort types
    # annotations: {}
    # loadBalancerIP: ""
    # externalIPs: []
    # nodePort: 30617
  env:
    - name: PIHOLE_HOSTNAME
      value: "127.0.0.1"
    - name: PIHOLE_PORT
      value: "80"
    - name: INTERVAL
      value: "10s"
    # Uncomment to use password authentication:
    # - name: PIHOLE_PASSWORD
    #   valueFrom:
    #     secretKeyRef:
    #       name: pihole-secret
    #       key: password
    # Or use API token (WEBPASSWORD from /etc/pihole/setupVars.conf):
    # - name: PIHOLE_API_TOKEN
    #   value: "your-api-token-here"
  # Override metrics container command (optional, useful for Vault integration)
  command: []
  # Override metrics container args (optional)
  args: []
  # Init container for metrics (optional, useful for adding shell to scratch-based images)
  initContainer: []
  # Volume mounts for metrics container (optional)
  volumeMounts: []
  resources:
    limits:
      memory: 64Mi
      cpu: 50m
    requests:
      memory: 32Mi
      cpu: 10m
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
    relabelings: []
    metricRelabelings: []
  dashboards:
    enabled: false
    # Label for Grafana dashboard sidecar discovery
    # For kube-prometheus-stack, use: grafana_dashboard
    label: "grafana_dashboard"
    labelValue: "1"
    annotations: {}

# ------------------------------------------------------------------------------
# SECURITY
# ------------------------------------------------------------------------------
securityContext:
  capabilities:
    add:
      - NET_ADMIN # Required for DHCP functionality
      - SYS_TIME # Required for NTP functionality

networkPolicy:
  enabled: false
  webAllowFrom: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1

resources:
  limits:
    memory: 256Mi
    cpu: 200m
  requests:
    memory: 128Mi
    cpu: 100m

affinity: {}
nodeSelector: {}
tolerations: []

# Extra volumes to add to the pod (optional)
extraVolumes: []
