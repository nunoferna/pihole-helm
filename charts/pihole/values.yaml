        # @schema type:boolean,null
        # -- (boolean) No description provided.
        # @section -- Webserver
        # @default -- true
        cli_pw: null
        # @schema type:array,null
        # -- (array) No description provided.
        # @section -- Webserver
        # @default -- []
        excludeClients: null
        # @schema type:array,null
        # -- (array) No description provided.
        # @section -- Webserver
        # @default -- []
        excludeDomains: null
        # @schema type:integer,null
        # -- (integer) No description provided.
        # @section -- Webserver
        # @default -- 86400
        maxHistory: null
        # @schema type:integer,null
        # -- (integer) No description provided.
        # @section -- Webserver
        # @default -- 10
        maxClients: null
        # @schema type:boolean,null
        # -- (boolean) No description provided.
        # @section -- Webserver
        # @default -- true
        client_history_global_max: null
        # @schema type:boolean,null
        # -- (boolean) No description provided.
        # @section -- Webserver
        # @default -- true
        allow_destructive: null
        temp:
          # @schema type:number,null
          # -- (number) No description provided.
          # @section -- Webserver
          # @default -- 60.000000
          limit: null
          # @schema type:string,null
          # -- (string) Options: https://docs.pi-hole.net/ftldns/configfile/#unit
          # @section -- Webserver
          # @default -- "C"
          unit: null

    files:
      # @schema type:string,null
      # -- Location of the disk-backed temporary database.
      tmp_db: null
      # @schema type:string,null
      # -- (string) No description provided.
      # @section -- Advanced
      # @default -- "/etc/pihole/pihole-FTL.db"
      database: null
      # @schema type:string,null
      # -- (string) No description provided.
      # @section -- Advanced
      # @default -- "/etc/pihole/gravity.db"
      gravity: null
      # @schema type:string,null
      # -- (string) No description provided.
      # @section -- Advanced
      # @default -- "/tmp"
      gravity_tmp: null
      # @schema type:string,null
      # -- (string) No description provided.
      # @section -- Advanced
      # @default -- "/etc/pihole/macvendor.db"
      macvendor: null
      # @schema type:string,null
      # -- (string) No description provided.
      # @section -- Advanced
      # @default -- ""
      pcap: null
      log:
        # @schema type:string,null
        # -- (string) No description provided.
        # @section -- Advanced
        # @default -- "/var/log/pihole/FTL.log"
        ftl: null
        # @schema type:string,null
        # -- (string) No description provided.
