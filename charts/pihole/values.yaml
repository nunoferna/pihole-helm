image:
  repository: pihole/pihole
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to appVersion
  # -- Explicit opt-out from the recorded image compatibility baseline.
  allowUnverified: false
  # -- Immutable multi-platform digest. Clear explicitly when testing another image.
  digest: "sha256:66c798d79a95c2691f280329c3611dba1746117c61c9f331907ca35a06a52778"

imagePullSecrets: []

timezone: "UTC"

# @schema minimum:1
replicas: 1

# @schema enum:[Parallel, OrderedReady]
# -- Stable StatefulSet identity for all replica counts.
podManagementPolicy: Parallel
# @schema minimum:0
minReadySeconds: 5
# @schema minimum:1
terminationGracePeriodSeconds: 30

# -- Change when rotating an externally managed Secret; rolls DNS and exporter pods.
credentialsRevision: ""

# @schema minimum:1
# -- Total deadline in seconds for policy validation, reconciliation and gravity.
policyImportTimeout: 180

policy:
  # -- Explicit original namespace/release identity when restoring a journal into a new release. Empty derives the current identity.
  owner: ""
  # -- Require SHA-256 pinned HTTPS subscriptions and reject enabled unmanaged feeds.
  requirePinnedLists: false
  # @schema enum:[reconcile, additive, disabled]
  # -- Reconcile owned records, apply without deletion, or explicitly freeze policy management.
  mode: reconcile
  # -- Explicitly adopt matching existing records. Enable only for a reviewed migration, then disable.
  adoptExisting: false
  # -- Optional externally retained immutable artifact containing policy.json and the runner files.
  existingConfigMap: ""
  # -- Required SHA-256 of policy.json when referencing an external artifact.
  revision: ""

# -- Internal listener ports. Kubernetes Services retain their normal client ports.
listeners:
  # @schema minimum:1
  # @schema maximum:65535
  dns: 5353
  # @schema minimum:1
  # @schema maximum:65535
  http: 8080
  # @schema minimum:0
  # @schema maximum:65535
  https: 8443  # Set to 0 to disable HTTPS

probes:
  dns:
    name: pi.hole
    expectedAddress: ""
  startup:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  liveness:
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

validation:
  # -- Optional known blocked domain for Helm tests and scheduled DNS checks. No rules are installed implicitly.
  blockedDomain: ""
  # -- Expected blocked A answer, or NXDOMAIN when using that blocking mode.
  blockedAnswer: "0.0.0.0"
  # -- Optional upstream lookup. Empty keeps checks independent of public DNS.
  upstreamDomain: ""

tests:
  enabled: true
  # -- Verify credentials against every replica and the private web Service when enabled.
  authentication: true
  # -- Optional credential Secret for tests when application credentials use an injector.
  existingSecret: ""
  # @schema minimum:10
  timeoutSeconds: 120

monitoring:
  # -- Namespace for ServiceMonitor and PrometheusRule; empty uses the release namespace.
  namespace: ""
  labels: {}
  alerts:
    enabled: false
    for: 2m
  syntheticDns:
    # -- Run recurring UDP/TCP resolution and optional filtering checks against Service and every replica.
    enabled: false
    schedule: "* * * * *"
    # @schema minimum:10
    timeoutSeconds: 45
    # @schema minimum:60
    staleAfterSeconds: 180

# StatefulSet rolling update strategy
updateStrategy:
  type: RollingUpdate
  # rollingUpdate:
  #   partition: 0

# Pod annotations (useful for secret injection like Vault, AWS Secrets Manager, etc.)
podAnnotations: {}

# Extra environment variables to append to the container
extraEnv: []
  # - name: MY_CUSTOM_VAR
  #   value: "my-value"

# Extra init containers to run before the main container
# Useful for transforming secrets from external providers
extraInitContainers: []

# Override container command (optional)
command: []
  # Example: ["/bin/bash", "-c"]

# Override container args (optional)
args: []

pihole:
  # Example policy belongs in examples/; defaults must not install sample allow/deny rules.
  lists:
    # -- Subscriptions: address, optional sha256, type (block/allow), enabled, comment, groups. Pinned content is cached on each PVC.
    adlists: []
    whitelist: []
    blacklist: []
    regex_whitelist: []
    regex_blacklist: []

  # @schema type:array,null
  # -- (array) Owned groups. Built-in Default is protected. Entries accept name, description and enabled.
  groups: []

  # @schema type:array,null
  # -- (array) List of Pi-hole clients. Each client can be identified by an IPv4 address, IPv6 address, or MAC address.
  # @section -- Clients
  # @default -- []
  clients: []
  # clients:
  #   - id: "192.168.1.100"   # can be an IPv4, IPv6, or MAC address (e.g. "aa:bb:cc:dd:ee:ff")
  #     comment: "My PC"
  #     groups:
  #       - "default"
  #   - id: "aa:bb:cc:dd:ee:ff"
  #     comment: "My Phone"
  #     groups:
  #       - "default"

  # Web logic (Kubernetes specific helper)
  web:
    # @schema type:string,null
    # -- (string) Explicit non-empty password for a chart-managed Secret. Prefer existingSecret in production. No random password is generated.
    # @section -- Web
    password: ""
    # @schema type:string,null
    # -- (string) Key in the Kubernetes secret that contains the web interface password. Ignored if using external secret injection.
    # @section -- Web
    passwordSecretKey: "password"
    # @schema type:string,null
    # -- (string) Name of an existing Kubernetes Secret in the same namespace that contains the web interface password. If set, this secret will be used instead of creating a new one. Ignored if using external secret injection.
    # @section -- Web
    existingSecret: ""
    # @schema type:boolean,null
    # -- (boolean) Whether to skip setting the default web password environment variable when using external secret injection. Set to true if you are defining the FTLCONF_webserver_api_password variable in extraEnv with a value sourced from an external secret.
    # @section -- Web
    skipPasswordEnv: false

    # WEB K8S SERVICE #
  # FTL Configuration
  # Maps directly to pihole-FTL.toml structure
  # Reference: https://docs.pi-hole.net/ftldns/configfile/
  ftl:
    dns:
      # @schema type:array,null
      # -- (array) List of upstream DNS servers.
      # @section -- DNS
      # @default -- [8.8.8.8, 8.8.4.4]
      upstreams: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DNS
      # @default -- true
      CNAMEdeepInspect: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DNS
      # @default -- true
      blockESNI: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DNS
      # @default -- true
      EDNS0ECS: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DNS
      # @default -- false
      ignoreLocalhost: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DNS
      # @default -- true
      showDNSSEC: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DNS
      # @default -- false
      analyzeOnlyAandAAAA: null
      # @schema type:string,null
      # -- (string) Options: https://docs.pi-hole.net/ftldns/configfile/#piholeptr
      # @section -- DNS
      # @default -- "PI.HOLE"
      piholePTR: null
      # @schema type:string,null
      # -- (string) Options: https://docs.pi-hole.net/ftldns/configfile/#replywhenbusy
      # @section -- DNS
      # @default -- "ALLOW"
      replyWhenBusy: null
      # @schema type:integer,null
      # -- (integer) No description provided.
      # @section -- DNS
      # @default -- 2
      blockTTL: null
      # @schema type:array,null
      # -- (array) No description provided.
      # @section -- DNS
      # @default -- []
      hosts: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DNS
      # @default -- false
      domainNeeded: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DNS
      # @default -- false
      expandHosts: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DNS
      # @default -- true
      bogusPriv: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DNS
      # @default -- false
      dnssec: null
      # @schema type:string,null
      # -- (string) No description provided.
      # @section -- DNS
      # @default -- ""
      interface: null
      # @schema type:string,null
      # -- (string) No description provided.
      # @section -- DNS
      # @default -- ""
      hostRecord: null
      # @schema type:string,null
      # -- (string) Accept Kubernetes Service/pod traffic. Restrict DNS clients with NetworkPolicy and private service exposure.
      # @section -- DNS
      listeningMode: ALL
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DNS
      # @default -- true
      queryLogging: null
      # @schema type:array,null
      # -- (array) No description provided.
      # @section -- DNS
      # @default -- []
      cnameRecords: null
      # @schema type:integer,null
      # -- (integer) No description provided.
      # @section -- DNS
      # @default -- 53
      port: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DNS
      # @default -- true
      localise: null
      # @schema type:array,null
      # -- (array) No description provided.
      # @section -- DNS
      # @default -- []
      revServers: null

      domain:
        # @schema type:string,null
        # -- (string) No description provided.
        # @section -- DNS
        # @default -- "lan"
        name: null
        # @schema type:boolean,null
        # -- (boolean) No description provided.
        # @section -- DNS
        # @default -- true
        local: null

      cache:
        # @schema type:integer,null
        # -- (integer) No description provided.
        # @section -- DNS
        # @default -- 10000
        size: null
        # @schema type:integer,null
        # -- (integer) No description provided.
        # @section -- DNS
        # @default -- 3600
        optimizer: null
        # @schema type:integer,null
        # -- (integer) No description provided.
        # @section -- DNS
        # @default -- 86400
        upstreamBlockedTTL: null
        # @schema type:string,null
        # -- Cached RR types supported by FTL v6.8 (for example ANY).
        rrtype: null

      blocking:
        # @schema type:boolean,null
        # -- (boolean) No description provided.
        # @section -- DNS
        # @default -- true
        active: null
        # @schema type:string,null
        # -- (string) Options: https://docs.pi-hole.net/ftldns/configfile/#mode
        # @section -- DNS
        # @default -- "NULL"
        mode: null
        # @schema type:string,null
        # -- (string) Options: https://docs.pi-hole.net/ftldns/configfile/#edns
        # @section -- DNS
        # @default -- "TEXT"
        edns: null

      specialDomains:
        # @schema type:boolean,null
        # -- (boolean) No description provided.
        # @section -- DNS
        # @default -- true
        mozillaCanary: null
        # @schema type:boolean,null
        # -- (boolean) No description provided.
        # @section -- DNS
        # @default -- true
        iCloudPrivateRelay: null
        # @schema type:boolean,null
        # -- (boolean) No description provided.
        # @section -- DNS
        # @default -- true
        designatedResolver: null

      reply:
        host:
          # @schema type:boolean,null
          # -- (boolean) No description provided.
          # @section -- DNS
          # @default -- false
          force4: null
          # @schema type:string,null
          # -- (string) No description provided.
          # @section -- DNS
          # @default -- ""
          IPv4: null
          # @schema type:boolean,null
          # -- (boolean) No description provided.
          # @section -- DNS
          # @default -- false
          force6: null
          # @schema type:string,null
          # -- (string) No description provided.
          # @section -- DNS
          # @default -- ""
          IPv6: null
        blocking:
          # @schema type:boolean,null
          # -- (boolean) No description provided.
          # @section -- DNS
          # @default -- false
          force4: null
          # @schema type:string,null
          # -- (string) No description provided.
          # @section -- DNS
          # @default -- ""
          IPv4: null
          # @schema type:boolean,null
          # -- (boolean) No description provided.
          # @section -- DNS
          # @default -- false
          force6: null
          # @schema type:string,null
          # -- (string) No description provided.
          # @section -- DNS
          # @default -- ""
          IPv6: null

      rateLimit:
        # @schema type:integer,null
        # -- (integer) No description provided.
        # @section -- DNS
        # @default -- 1000
        count: null
        # @schema type:integer,null
        # -- (integer) No description provided.
        # @section -- DNS
        # @default -- 60
        interval: null

      # DNS K8S SERVICE #
    dhcp:
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DHCP
      # @default -- false
      active: false
      # @schema type:string,null
      # -- (string) No description provided.
      # @section -- DHCP
      # @default -- ""
      start: null
      # @schema type:string,null
      # -- (string) No description provided.
      # @section -- DHCP
      # @default -- ""
      end: null
      # @schema type:string,null
      # -- (string) No description provided.
      # @section -- DHCP
      # @default -- ""
      router: null
      # @schema type:string,null
      # -- (string) No description provided.
      # @section -- DHCP
      # @default -- ""
      netmask: null
      # @schema type:string,null
      # -- (string) No description provided.
      # @section -- DHCP
      # @default -- ""
      leaseTime: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DHCP
      # @default -- false
      rapidCommit: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DHCP
      # @default -- false
      multiDNS: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DHCP
      # @default -- false
      logging: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- DHCP
      # @default -- false
      ignoreUnknownClients: null
      # @schema type:array,null
      # -- (array) No description provided.
      # @section -- DHCP
      # @default -- []
      hosts: null

      # DHCP K8S SERVICE #
      # Optional: Required only if using Pi-hole's DHCP functions (port 67)
      # DHCPv6 K8S SERVICE #
      # Optional: Required only when pihole.ftl.dhcp.ipv6 is enabled (port 547)
      # @schema type:boolean,null
      # -- Native DHCPv6 switch. Auxiliary services are outside the DNS HA profile.
      ipv6: false

    ntp:
      ipv4:
        # @schema type:boolean,null
        # -- (boolean) NTP functionality on IPv4.
        # @section -- NTP
        # @default -- true
        active: false
        # @schema type:string,null
        # -- (string) NTP address on IPv4.
        # @section -- NTP
        # @default -- ""
        address: null
      ipv6:
        # @schema type:boolean,null
        # -- (boolean) NTP functionality on IPv6.
        # @section -- NTP
        # @default -- true
        active: false
        # @schema type:string,null
        # -- (string) NTP address on IPv6.
        # @section -- NTP
        # @default -- ""
        address: null
      sync:
        # @schema type:boolean,null
        # -- (boolean) Whether to enable NTP time synchronization.
        # @section -- NTP
        # @default -- true
        active: false
        # @schema type:string,null
        # -- (string) NTP server to sync with. Can be an IP address or hostname. Set to empty string to disable syncing.
        # @section -- NTP
        # @default -- "pool.ntp.org"
        server: null
        # @schema type:integer,null
        # -- (integer) NTP sync interval in seconds.
        # @section -- NTP
        # @default -- 3600
        interval: null
        # @schema type:integer,null
        # -- (integer) NTP sync count.
        # @section -- NTP
        # @default -- 8
        count: null
        rtc:
          # @schema type:boolean,null
          # -- (boolean) Whether to set the RTC (Real-Time Clock) to the current time.
          # @section -- NTP
          # @default -- false
          set: null
          # @schema type:string,null
          # -- (string) RTC device to use when setting the clock.
          # @section -- NTP
          # @default -- "/dev/rtc0"
          device: null
          # @schema type:boolean,null
          # -- (boolean) Whether to use UTC time when setting the RTC.
          # @section -- NTP
          # @default -- true
          utc: null

      # NTP K8S SERVICE #
      # Optional: Required only when using pihole-FTL as NTP-Server (port 123)
    resolver:
      # @schema type:boolean,null
      # -- (boolean) Whether to resolve IPv4 addresses to hostnames in the query log and other outputs.
      # @default -- true
      resolveIPv4: null
      # @schema type:boolean,null
      # -- (boolean) Whether to resolve IPv6 addresses to hostnames in the query log and other outputs.
      # @default -- true
      resolveIPv6: null
      # @schema type:boolean,null
      # -- (boolean) Control whether FTL should use the fallback option to try to obtain client names from checking the network table.
      # @default -- true
      networkNames: null
      # @schema type:boolean,null
      # -- Resolve client MAC addresses through configured names.
      macNames: null
      # @schema type:string,null
      # -- (string) Options: https://docs.pi-hole.net/ftldns/configfile/#refreshnames
      # @default -- "IPV4_ONLY"
      refreshNames: null

    database:
      # @schema type:boolean,null
      # -- (boolean) Should FTL load information from the database on startup to be aware of the most recent history?
      # @section -- Database
      # @default -- true
      DBimport: null
      # @schema type:integer,null
      # -- (integer) Maximum number of days to keep database entries.
      # @section -- Database
      # @default -- 91
      maxDBdays: null
      # @schema type:integer,null
      # -- (integer) Database update interval in seconds.
      # @section -- Database
      # @default -- 60
      DBinterval: null
      # @schema type:boolean,null
      # -- (boolean) Whether to use WAL (Write-Ahead Logging) for the database.
      # @section -- Database
      # @default -- true
      useWAL: null
      # @schema type:boolean,null
      # -- Use a disk-backed short-term database (FTL v6.8).
      forceDisk: null
      network:
        # @schema type:boolean,null
        # -- (boolean) Whether to parse the ARP cache.
        # @section -- Database
        # @default -- true
        parseARPcache: null
        # @schema type:integer,null
        # -- (integer) Number of days after which an entry in the ARP cache is considered stale.
        # @section -- Database
        # @default -- 91
        expire: null

    webserver:
      # @schema type:string,null
      # -- (string) Domain to use for the Pi-hole web interface. Set to empty string to disable.
      # @section -- Webserver
      # @default -- "pi.hole"
      domain: null
      # @schema type:string,null
      # -- (string) No description provided.
      # @section -- Webserver
      # @default -- ""
      acl: null
      # @schema type:string,null
      # -- (string) No description provided.
      # @section -- Webserver
      # @default -- "80o,443os,[::]:80o,[::]:443os"
      port: null
      # @schema type:integer,null
      # -- (integer) No description provided.
      # @section -- Webserver
      # @default -- 50
      threads: null
      # @schema type:array,null
      # -- (array) Headers to be set on all webserver responses. Check default value in pihole-FTL.toml for format.
      headers: null
      # @schema type:boolean,null
      # -- (boolean) No description provided.
      # @section -- Webserver
      # @default -- false
      serve_all: null
      # @schema type:array,null
      # -- (array) Additional options to be passed to the webserver. Can be used to set custom options like TLS configuration, etc.
      # @section -- Webserver
      # @default -- []
      advancedOpts: null

      session:
        # @schema type:integer,null
        # -- (integer) Session timeout in seconds.
        # @section -- Webserver
        # @default -- 1800
        timeout: null
        # @schema type:boolean,null
        # -- (boolean) Whether to restore sessions after a restart. If false, all sessions will be lost on restart.
        # @section -- Webserver
        # @default -- true
        restore: null

      tls:
        # @schema type:string,null
        # -- (string) Path to TLS certificate file. Set to empty string to disable TLS.
        # @section -- Webserver
        # @default -- "/etc/pihole/tls.pem"
        cert: null
        # @schema type:integer,null
        # -- (integer) TLS validity period in days.
        # @section -- Webserver
        # @default -- 47
        validity: null

      paths:
        # @schema type:string,null
        # -- (string) Web root directory for the Pi-hole web interface.
        # @section -- Webserver
        # @default -- "/var/www/html"
        webroot: null
        # @schema type:string,null
        # -- (string) URL path prefix for the Pi-hole web interface. Set to empty string for no prefix (root).
        # @section -- Webserver
        # @default -- "/admin/"
        webhome: null
        # @schema type:string,null
        # -- (string) URL prefix for the Pi-hole API. Set to empty string for no prefix (root).
        # @section -- Webserver
        # @default -- ""
        prefix: null

      interface:
        # @schema type:boolean,null
        # -- (boolean) Should the web interface use the boxed layout?
        # @section -- Webserver
        # @default -- true
        boxed: null
        # @schema type:string,null
        # -- (string) Theme used by the Pi-hole web interface. Options: https://docs.pi-hole.net/ftldns/configfile/#theme
        # @section -- Webserver
        # @default -- "default-auto"
        theme: null

      api:
        # @schema type:integer,null
        # -- (integer) No description provided.
        # @section -- Webserver
        # @default -- 16
        max_sessions: null
        # @schema type:boolean,null
        # -- (boolean) No description provided.
        # @section -- Webserver
        # @default -- false
        prettyJSON: null
        # @schema type:string,null
        # -- (string) No description provided.
        # @section -- Webserver
        # @default -- ""
        pwhash: null
        # @schema type:string,null
        # -- (string) No description provided.
        # @section -- Webserver
        # @default -- ""
        totp_secret: null
        # @schema type:string,null
        # -- (string) No description provided.
        # @section -- Webserver
        # @default -- ""
