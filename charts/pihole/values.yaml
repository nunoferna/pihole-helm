# ------------------------------------------------------------------------------
# GLOBAL & IMAGE SETTINGS
# ------------------------------------------------------------------------------
image:
  repository: pihole/pihole
  pullPolicy: IfNotPresent
  tag: "" # Defaults to appVersion

imagePullSecrets: []

timezone: "UTC"

# ------------------------------------------------------------------------------
# DEPLOYMENT SETTINGS
# ------------------------------------------------------------------------------
replicas: 1

strategy:
  type: Recreate
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 0

# Pod annotations (useful for secret injection like Vault, AWS Secrets Manager, etc.)
podAnnotations: {}

# Extra environment variables to append to the container
extraEnv: []
  # - name: MY_CUSTOM_VAR
  #   value: "my-value"

# Extra init containers to run before the main container
# Useful for transforming secrets from external providers
extraInitContainers: []

# Override container command (optional)
command: []
  # Example: ["/bin/bash", "-c"]

# Override container args (optional)
args: []

# ------------------------------------------------------------------------------
# PI-HOLE FTL CONFIGURATION (COMPLETE)
# ------------------------------------------------------------------------------
pihole:
  lists:
    adlists:
      - address: "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
        comment: "StevenBlack Master" # enabled is true by default
      - address: "https://adaway.org/hosts.txt"
        enabled: false # Explicitly disabled
        comment: "AdAway"

    whitelist:
      - domain: "good-site.com"
        # enabled: true (implicit)
        # comment: "Helm-Import" (default if missing)

    blacklist:
      - domain: "bad-site.com"
        comment: "Known malware"

    regex_whitelist:
      - domain: ".*\\.google\\.com$"
        comment: "Allow Google subdomains"

    regex_blacklist: []

  # Web Password logic (Kubernetes specific helper)
  web:
    password: ""
    passwordSecretKey: "password"
    existingSecret: ""
    # Skip the default password env var when using external secret injection
    # Set to true when defining FTLCONF_webserver_api_password in extraEnv
    skipPasswordEnv: false

