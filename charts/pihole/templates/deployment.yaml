            {{- end }}
            {{- if .Values.pihole.ftl.dhcp.netmask }}
            - name: FTLCONF_dhcp_netmask
              value: {{ .Values.pihole.ftl.dhcp.netmask | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dhcp.leaseTime }}
            - name: FTLCONF_dhcp_leaseTime
              value: {{ .Values.pihole.ftl.dhcp.leaseTime | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dhcp "ipv6" }}
            - name: FTLCONF_dhcp_ipv6
              value: {{ .Values.pihole.ftl.dhcp.ipv6 | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dhcp "rapidCommit" }}
            - name: FTLCONF_dhcp_rapidCommit
              value: {{ .Values.pihole.ftl.dhcp.rapidCommit | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dhcp "multiDNS" }}
            - name: FTLCONF_dhcp_multiDNS
              value: {{ .Values.pihole.ftl.dhcp.multiDNS | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dhcp "logging" }}
            - name: FTLCONF_dhcp_logging
              value: {{ .Values.pihole.ftl.dhcp.logging | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dhcp "ignoreUnknownClients" }}
            - name: FTLCONF_dhcp_ignoreUnknownClients
              value: {{ .Values.pihole.ftl.dhcp.ignoreUnknownClients | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dhcp.hosts }}
            - name: FTLCONF_dhcp_hosts
              value: {{ .Values.pihole.ftl.dhcp.hosts | join "\n" | quote }}
            {{- end }}

            # ------------------------------------------------------
            # [ntp]
            # ------------------------------------------------------
            {{- if hasKey .Values.pihole.ftl.ntp.ipv4 "active" }}
            - name: FTLCONF_ntp_ipv4_active
              value: {{ .Values.pihole.ftl.ntp.ipv4.active | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.ntp.ipv4.address }}
            - name: FTLCONF_ntp_ipv4_address
              value: {{ .Values.pihole.ftl.ntp.ipv4.address | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.ntp.ipv6 "active" }}
            - name: FTLCONF_ntp_ipv6_active
              value: {{ .Values.pihole.ftl.ntp.ipv6.active | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.ntp.ipv6.address }}
            - name: FTLCONF_ntp_ipv6_address
              value: {{ .Values.pihole.ftl.ntp.ipv6.address | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.ntp.sync "active" }}
            - name: FTLCONF_ntp_sync_active
              value: {{ .Values.pihole.ftl.ntp.sync.active | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.ntp.sync.server }}
            - name: FTLCONF_ntp_sync_server
              value: {{ .Values.pihole.ftl.ntp.sync.server | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.ntp.sync "interval" }}
            - name: FTLCONF_ntp_sync_interval
              value: {{ .Values.pihole.ftl.ntp.sync.interval | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.ntp.sync "count" }}
            - name: FTLCONF_ntp_sync_count
              value: {{ .Values.pihole.ftl.ntp.sync.count | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.ntp.sync.rtc "set" }}
            - name: FTLCONF_ntp_sync_rtc_set
              value: {{ .Values.pihole.ftl.ntp.sync.rtc.set | quote }}
