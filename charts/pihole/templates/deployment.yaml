            {{- end }}

            # [dns.rateLimit]
            {{- if hasKey .Values.pihole.ftl.dns.rateLimit "count" }}
            - name: FTLCONF_dns_rateLimit_count
              value: {{ .Values.pihole.ftl.dns.rateLimit.count | quote }}
