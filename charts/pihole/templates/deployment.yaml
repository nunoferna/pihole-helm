apiVersion: apps/v1
kind: {{ include "pihole.workloadKind" . }}
metadata:
  name: {{ include "pihole.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/drop-net-raw-capability: "Pi-hole requires NET_RAW capability for DHCP operations"
    ignore-check.kube-linter.io/no-read-only-root-fs: "Pi-hole needs write access to filesystem for configuration and logs"
    ignore-check.kube-linter.io/run-as-non-root: "Pi-hole requires specific UID/GID configuration for proper operation"
spec:
  replicas: {{ .Values.replicas }}
{{- if eq (include "pihole.isStatefulSet" .) "true" }}
  serviceName: {{ include "pihole.fullname" . }}-headless
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
{{- else }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
{{- end }}
  selector:
    matchLabels:
      {{- include "pihole.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pihole.selectorLabels" . | nindent 8 }}
{{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "pihole.fullname" .) | quote }}
      hostNetwork: {{ .Values.networking.hostNetwork }}
{{- if .Values.networking.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
{{- else }}
      dnsPolicy: ClusterFirst
{{- end }}
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
{{- end }}

{{- if or .Values.extraInitContainers (and .Values.metrics.enabled .Values.metrics.initContainer) }}
      initContainers:
  {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
  {{- end }}
  {{- if and .Values.metrics.enabled .Values.metrics.initContainer }}
        {{- toYaml .Values.metrics.initContainer | nindent 8 }}
  {{- end }}
{{- end }}

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
{{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
{{- end }}
          securityContext:
            capabilities:
              add:
{{- if or .Values.pihole.ftl.dhcp.service.enabled .Values.networking.hostNetwork }}
                - NET_ADMIN # Required for DHCP & modifying routing tables
                - NET_RAW   # Required for DHCPv6 & collision checks
{{- end }}
{{- with .Values.securityContext.capabilities.add }}
  {{- range . }}
                - {{ . }}
  {{- end }}
{{- end }}
          lifecycle:
            postStart:
              exec:
                command: ["/bin/bash", "/usr/local/bin/import-lists.sh"]
          env:
{{- if .Values.timezone }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
{{- end }}

{{- with .Values.pihole.ftl }}
