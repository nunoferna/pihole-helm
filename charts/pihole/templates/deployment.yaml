apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pihole.fullname" . }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "pihole.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pihole.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "pihole.fullname" .) | quote }}
      hostNetwork: {{ .Values.networking.hostNetwork }}
      {{- if .Values.networking.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- else }}
      dnsPolicy: ClusterFirst
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            capabilities:
              add:
                {{- if or .Values.serviceDhcp.enabled .Values.networking.hostNetwork }}
                - NET_ADMIN
                {{- end }}
                {{- range .Values.securityContext.capabilities.add }}
                - {{ . }}
                {{- end }}
          lifecycle:
            postStart:
              exec:
                command: ["/bin/bash", "/usr/local/bin/import-lists.sh"]
          env:
            {{- if .Values.timezone }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            {{- end }}
            
            # ------------------------------------------------------
            # [dns]
            # ------------------------------------------------------
            {{- if .Values.pihole.ftl.dns.upstreams }}
            - name: FTLCONF_dns_upstreams
              value: {{ .Values.pihole.ftl.dns.upstreams | join ";" | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns "CNAMEdeepInspect" }}
            - name: FTLCONF_dns_CNAMEdeepInspect
              value: {{ .Values.pihole.ftl.dns.CNAMEdeepInspect | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns "blockESNI" }}
            - name: FTLCONF_dns_blockESNI
              value: {{ .Values.pihole.ftl.dns.blockESNI | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns "EDNS0ECS" }}
            - name: FTLCONF_dns_EDNS0ECS
              value: {{ .Values.pihole.ftl.dns.EDNS0ECS | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns "ignoreLocalhost" }}
            - name: FTLCONF_dns_ignoreLocalhost
              value: {{ .Values.pihole.ftl.dns.ignoreLocalhost | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns "showDNSSEC" }}
            - name: FTLCONF_dns_showDNSSEC
              value: {{ .Values.pihole.ftl.dns.showDNSSEC | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns "analyzeOnlyAandAAAA" }}
            - name: FTLCONF_dns_analyzeOnlyAandAAAA
              value: {{ .Values.pihole.ftl.dns.analyzeOnlyAandAAAA | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dns.piholePTR }}
            - name: FTLCONF_dns_piholePTR
              value: {{ .Values.pihole.ftl.dns.piholePTR | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dns.replyWhenBusy }}
            - name: FTLCONF_dns_replyWhenBusy
              value: {{ .Values.pihole.ftl.dns.replyWhenBusy | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns "blockTTL" }}
            - name: FTLCONF_dns_blockTTL
              value: {{ .Values.pihole.ftl.dns.blockTTL | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dns.hosts }}
            - name: FTLCONF_dns_hosts
              value: {{ .Values.pihole.ftl.dns.hosts | join "\n" | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns "domainNeeded" }}
            - name: FTLCONF_dns_domainNeeded
              value: {{ .Values.pihole.ftl.dns.domainNeeded | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns "expandHosts" }}
            - name: FTLCONF_dns_expandHosts
              value: {{ .Values.pihole.ftl.dns.expandHosts | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns "bogusPriv" }}
            - name: FTLCONF_dns_bogusPriv
              value: {{ .Values.pihole.ftl.dns.bogusPriv | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns "dnssec" }}
            - name: FTLCONF_dns_dnssec
              value: {{ .Values.pihole.ftl.dns.dnssec | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dns.interface }}
            - name: FTLCONF_dns_interface
              value: {{ .Values.pihole.ftl.dns.interface | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dns.hostRecord }}
            - name: FTLCONF_dns_hostRecord
              value: {{ .Values.pihole.ftl.dns.hostRecord | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dns.listeningMode }}
            - name: FTLCONF_dns_listeningMode
              value: {{ .Values.pihole.ftl.dns.listeningMode | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns "queryLogging" }}
            - name: FTLCONF_dns_queryLogging
              value: {{ .Values.pihole.ftl.dns.queryLogging | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dns.cnameRecords }}
            - name: FTLCONF_dns_cnameRecords
              value: {{ .Values.pihole.ftl.dns.cnameRecords | join "\n" | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns "port" }}
            - name: FTLCONF_dns_port
              value: {{ .Values.pihole.ftl.dns.port | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dns.localise }}
            - name: FTLCONF_dns_localise
              value: {{ .Values.pihole.ftl.dns.localise | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dns.revServers }}
            - name: FTLCONF_dns_revServers
              value: {{ .Values.pihole.ftl.dns.revServers | join "\n" | quote }}
            {{- end }}

            # [dns.domain]
            {{- if .Values.pihole.ftl.dns.domain.name }}
            - name: FTLCONF_dns_domain_name
              value: {{ .Values.pihole.ftl.dns.domain.name | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dns.domain.local }}
            - name: FTLCONF_dns_domain_local
              value: {{ .Values.pihole.ftl.dns.domain.local | quote }}
            {{- end }}

            # [dns.cache]
            {{- if hasKey .Values.pihole.ftl.dns.cache "size" }}
            - name: FTLCONF_dns_cache_size
              value: {{ .Values.pihole.ftl.dns.cache.size | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns.cache "optimizer" }}
            - name: FTLCONF_dns_cache_optimizer
              value: {{ .Values.pihole.ftl.dns.cache.optimizer | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns.cache "upstreamBlockedTTL" }}
            - name: FTLCONF_dns_cache_upstreamBlockedTTL
              value: {{ .Values.pihole.ftl.dns.cache.upstreamBlockedTTL | quote }}
            {{- end }}

            # [dns.blocking]
            {{- if hasKey .Values.pihole.ftl.dns.blocking "active" }}
            - name: FTLCONF_dns_blocking_active
