    {{- end }}
    {{- if hasKey . "blockTTL" }}
            - name: FTLCONF_dns_blockTTL
              value: {{ .blockTTL | quote }}
    {{- end }}
    {{- if .hosts }}
            - name: FTLCONF_dns_hosts
              value: {{ .hosts | join "\n" | quote }}
    {{- end }}
    {{- if hasKey . "domainNeeded" }}
            - name: FTLCONF_dns_domainNeeded
              value: {{ .domainNeeded | quote }}
    {{- end }}
    {{- if hasKey . "expandHosts" }}
            - name: FTLCONF_dns_expandHosts
              value: {{ .expandHosts | quote }}
    {{- end }}
    {{- if hasKey . "bogusPriv" }}
            - name: FTLCONF_dns_bogusPriv
              value: {{ .bogusPriv | quote }}
    {{- end }}
    {{- if hasKey . "dnssec" }}
            - name: FTLCONF_dns_dnssec
              value: {{ .dnssec | quote }}
    {{- end }}
    {{- if .interface }}
            - name: FTLCONF_dns_interface
              value: {{ .interface | quote }}
    {{- end }}
    {{- if .hostRecord }}
            - name: FTLCONF_dns_hostRecord
              value: {{ .hostRecord | quote }}
    {{- end }}
    {{- if .listeningMode }}
            - name: FTLCONF_dns_listeningMode
              value: {{ .listeningMode | quote }}
    {{- end }}
    {{- if hasKey . "queryLogging" }}
            - name: FTLCONF_dns_queryLogging
              value: {{ .queryLogging | quote }}
    {{- end }}
    {{- if .cnameRecords }}
            - name: FTLCONF_dns_cnameRecords
              value: {{ .cnameRecords | join "\n" | quote }}
    {{- end }}
    {{- if hasKey . "port" }}
            - name: FTLCONF_dns_port
              value: {{ .port | quote }}
    {{- end }}
    {{- if .localise }}
            - name: FTLCONF_dns_localise
              value: {{ .localise | quote }}
    {{- end }}
    {{- if .revServers }}
            - name: FTLCONF_dns_revServers
              value: {{ .revServers | join "\n" | quote }}
    {{- end }}

            # [dns.domain]
    {{- with .domain }}
      {{- if .name }}
            - name: FTLCONF_dns_domain_name
