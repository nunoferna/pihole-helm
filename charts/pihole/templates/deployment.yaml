apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pihole.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/drop-net-raw-capability: "The DNS profile drops ALL capabilities; explicitly enabled DHCP adds NET_RAW"
    ignore-check.kube-linter.io/no-read-only-root-fs: "Pi-hole needs write access to filesystem for configuration and logs"
    ignore-check.kube-linter.io/run-as-non-root: "Pi-hole requires specific UID/GID configuration for proper operation"
spec:
  replicas: {{ .Values.replicas }}
  serviceName: {{ include "pihole.fullname" . }}-headless
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  persistentVolumeClaimRetentionPolicy:
    {{- toYaml .Values.persistence.retentionPolicy | nindent 4 }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "pihole.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pihole.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/credentials: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        credentials-revision: {{ .Values.credentialsRevision | quote }}
        pihole-helm/policy-revision: {{ include "pihole.policyRevision" . | quote }}
        pihole-helm/policy-artifact: {{ include "pihole.policyConfigMapName" . | quote }}
{{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ include "pihole.serviceAccountName" . | quote }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      hostNetwork: {{ .Values.networking.hostNetwork }}
{{- if .Values.networking.dnsPolicy }}
      dnsPolicy: {{ .Values.networking.dnsPolicy }}
{{- else if .Values.networking.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
{{- else }}
      dnsPolicy: ClusterFirst
{{- end }}
{{- with .Values.networking.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.networking.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
{{- end }}

{{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
{{- end }}

      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "pihole.image" (dict "image" .Values.image "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
{{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
{{- else }}
  {{- if eq (include "pihole.hasPolicy" .) "true" }}
          command:
            - /bin/bash
            - -ec
            - |
              test ! -e /etc/pihole/.restore-incomplete
              # Keep the stock entrypoint; route its scheduled gravity task
              # through the same bounded, verified, serialized policy runner.
              grep -q 'pihole updateGravity' /crontab.txt
              sed -i 's@pihole updateGravity@/bin/bash /etc/pihole-helm/import-lists.sh --refresh@g' /crontab.txt
    {{- if .Values.policy.requirePinnedLists }}
              if [ ! -e /etc/pihole/adlists.list ]; then : > /etc/pihole/adlists.list; fi
    {{- end }}
              exec /usr/bin/start.sh "$@"
            - pihole-start
  {{- end }}
{{- end }}
{{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- $securityContext := .Values.securityContext | default dict }}
{{- $capabilities := $securityContext.capabilities | default dict }}
{{- $capAdd := $capabilities.add | default (list) }}
{{- $capDrop := $capabilities.drop | default (list) }}
{{- $hasDynamicCaps := or .Values.pihole.ftl.dhcp.active .Values.pihole.ftl.dhcp.ipv6 }}
{{- $hasCaps := or $hasDynamicCaps (gt (len $capAdd) 0) (gt (len $capDrop) 0) }}
{{- if or (omit $securityContext "capabilities") $hasCaps }}
          securityContext:
  {{- with (omit $securityContext "capabilities") }}
            {{- toYaml . | nindent 12 }}
  {{- end }}
  {{- if $hasCaps }}
            capabilities:
    {{- with $capDrop }}
              drop:
                {{- toYaml . | nindent 16 }}
    {{- end }}
    {{- if or $hasDynamicCaps (gt (len $capAdd) 0) }}
              add:
      {{- if or .Values.pihole.ftl.dhcp.active .Values.pihole.ftl.dhcp.ipv6 }}
                - NET_ADMIN # Required for DHCP & modifying routing tables
                - NET_RAW   # Required for DHCPv6 & collision checks
      {{- end }}
      {{- range $capAdd }}
                - {{ . }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if eq (include "pihole.hasPolicy" .) "true" }}
          lifecycle:
            postStart:
              exec:
                command: ["/bin/bash", "/etc/pihole-helm/import-lists.sh"]
{{- end }}
          env:
            - name: HELM_HTTP_PORT
              value: {{ .Values.listeners.http | quote }}
            - name: HELM_POLICY_TIMEOUT
              value: {{ .Values.policyImportTimeout | quote }}
            - name: HELM_POLICY_REQUIRE_PINNED_LISTS
              value: {{ .Values.policy.requirePinnedLists | quote }}
            - name: HELM_POLICY_EXPECTED_REVISION
              value: {{ include "pihole.policyRevision" . | quote }}
            - name: HELM_POLICY_OWNER
              value: {{ include "pihole.policyOwner" . | quote }}
{{- if .Values.timezone }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
{{- end }}

{{ include "pihole.ftlEnvironment" . | nindent 12 }}

            # User/Permission Logic
{{- if not (kindIs "invalid" .Values.pihole.uid) }}
            - name: PIHOLE_UID
              value: {{ .Values.pihole.uid | quote }}
{{- end }}
{{- if not (kindIs "invalid" .Values.pihole.gid) }}
            - name: PIHOLE_GID
              value: {{ .Values.pihole.gid | quote }}
{{- end }}

            # ------------------------------------------------------
            # Other Pi-hole Variables
            # ------------------------------------------------------
{{- if not (kindIs "invalid" .Values.pihole.tailFtlLog) }}
            - name: TAIL_FTL_LOG
              value: {{ .Values.pihole.tailFtlLog | quote }}
{{- end }}
{{- if .Values.pihole.ftlCmd }}
            - name: FTL_CMD
              value: {{ .Values.pihole.ftlCmd | quote }}
{{- end }}
{{- if .Values.pihole.dnsmasqUser }}
            - name: DNSMASQ_USER
              value: {{ .Values.pihole.dnsmasqUser | quote }}
{{- end }}
{{- if .Values.pihole.additionalPackages }}
            - name: ADDITIONAL_PACKAGES
              value: {{ .Values.pihole.additionalPackages | quote }}
{{- end }}
{{- if not (kindIs "invalid" .Values.pihole.verbose) }}
            - name: PH_VERBOSE
              value: {{ .Values.pihole.verbose | quote }}
{{- end }}

            # Web Password (Generated or from Secret)
{{- if not .Values.pihole.web.skipPasswordEnv }}
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: {{ include "pihole.passwordSecretName" . | quote }}
                  key: {{ .Values.pihole.web.passwordSecretKey }}
{{- end }}

{{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
{{- end }}

          ports:
            - name: dns-tcp
              containerPort: {{ .Values.listeners.dns }}
              protocol: TCP
            - name: dns-udp
              containerPort: {{ .Values.listeners.dns }}
              protocol: UDP
            - name: http
              containerPort: {{ .Values.listeners.http }}
              protocol: TCP
{{- if gt (int .Values.listeners.https) 0 }}
            - name: https
              containerPort: {{ .Values.listeners.https }}
              protocol: TCP
{{- end }}
            - name: dhcp
              containerPort: 67
              protocol: UDP
            - name: dhcpv6
              containerPort: 547
              protocol: UDP
            - name: ntp
              containerPort: 123
              protocol: UDP

          startupProbe:
            {{- include "pihole.dnsProbe" (dict "root" . "requirePolicy" true) | nindent 12 }}
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            {{- include "pihole.dnsProbe" (dict "root" . "requirePolicy" false) | nindent 12 }}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- include "pihole.dnsProbe" (dict "root" . "requirePolicy" true) | nindent 12 }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}

          volumeMounts:
            - name: etc-pihole
              mountPath: /etc/pihole
{{- if or .Values.persistence.etcDnsmasq.enabled .Values.pihole.ftl.misc.etc_dnsmasq_d }}
            - name: etc-dnsmasq
              mountPath: /etc/dnsmasq.d
{{- end }}
{{- if eq (include "pihole.hasPolicy" .) "true" }}
            - name: lists
              mountPath: /etc/pihole-helm
              readOnly: true
{{- end }}
{{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
{{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
{{- if not .Values.persistence.etcPihole.enabled }}
        - name: etc-pihole
          emptyDir: {}
{{- end }}
{{- if and (not .Values.persistence.etcDnsmasq.enabled) .Values.pihole.ftl.misc.etc_dnsmasq_d }}
        - name: etc-dnsmasq
          emptyDir: {}
{{- end }}
{{- if eq (include "pihole.hasPolicy" .) "true" }}
        - name: lists
          configMap:
            name: {{ include "pihole.policyConfigMapName" . }}
            defaultMode: 0755
{{- end }}
{{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
{{- end }}

{{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
{{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- if eq (include "pihole.isStatefulSet" .) "true" }}
  volumeClaimTemplates:
  {{- if .Values.persistence.etcPihole.enabled }}
    - metadata:
        name: etc-pihole
        labels:
          {{- include "pihole.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.etcPihole.accessMode }}
    {{- if hasKey .Values.persistence.etcPihole "storageClassName" }}
        storageClassName: {{ .Values.persistence.etcPihole.storageClassName | quote }}
    {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.etcPihole.size }}
  {{- end }}
  {{- if .Values.persistence.etcDnsmasq.enabled }}
    - metadata:
        name: etc-dnsmasq
        labels:
          {{- include "pihole.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.etcDnsmasq.accessMode }}
    {{- if hasKey .Values.persistence.etcDnsmasq "storageClassName" }}
        storageClassName: {{ .Values.persistence.etcDnsmasq.storageClassName | quote }}
    {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.etcDnsmasq.size }}
  {{- end }}
{{- end }}
