              value: {{ .Values.pihole.ftl.ntp.sync.rtc.device | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.ntp.sync.rtc "utc" }}
            - name: FTLCONF_ntp_sync_rtc_utc
              value: {{ .Values.pihole.ftl.ntp.sync.rtc.utc | quote }}
            {{- end }}

            # ------------------------------------------------------
            # [resolver]
            # ------------------------------------------------------
            {{- if hasKey .Values.pihole.ftl.resolver "resolveIPv4" }}
