            {{- if .Values.pihole.ftl.webserver.api.excludeClients }}
            - name: FTLCONF_webserver_api_excludeClients
              value: {{ .Values.pihole.ftl.webserver.api.excludeClients | join "\n" | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.webserver.api.excludeDomains }}
            - name: FTLCONF_webserver_api_excludeDomains
              value: {{ .Values.pihole.ftl.webserver.api.excludeDomains | join "\n" | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.webserver.api "maxHistory" }}
            - name: FTLCONF_webserver_api_maxHistory
              value: {{ .Values.pihole.ftl.webserver.api.maxHistory | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.webserver.api "maxClients" }}
            - name: FTLCONF_webserver_api_maxClients
              value: {{ .Values.pihole.ftl.webserver.api.maxClients | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.webserver.api "client_history_global_max" }}
            - name: FTLCONF_webserver_api_client_history_global_max
              value: {{ .Values.pihole.ftl.webserver.api.client_history_global_max | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.webserver.api "allow_destructive" }}
            - name: FTLCONF_webserver_api_allow_destructive
              value: {{ .Values.pihole.ftl.webserver.api.allow_destructive | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.webserver.api.temp "limit" }}
            - name: FTLCONF_webserver_api_temp_limit
              value: {{ .Values.pihole.ftl.webserver.api.temp.limit | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.webserver.api.temp.unit }}
            - name: FTLCONF_webserver_api_temp_unit
              value: {{ .Values.pihole.ftl.webserver.api.temp.unit | quote }}
            {{- end }}

            # ------------------------------------------------------
            # [files]
            # ------------------------------------------------------
            {{- if .Values.pihole.ftl.files.pid }}
            - name: FTLCONF_files_pid
              value: {{ .Values.pihole.ftl.files.pid | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.files.database }}
            - name: FTLCONF_files_database
              value: {{ .Values.pihole.ftl.files.database | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.files.gravity }}
            - name: FTLCONF_files_gravity
              value: {{ .Values.pihole.ftl.files.gravity | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.files.gravity_tmp }}
            - name: FTLCONF_files_gravity_tmp
              value: {{ .Values.pihole.ftl.files.gravity_tmp | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.files.macvendor }}
            - name: FTLCONF_files_macvendor
              value: {{ .Values.pihole.ftl.files.macvendor | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.files.pcap }}
            - name: FTLCONF_files_pcap
              value: {{ .Values.pihole.ftl.files.pcap | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.files.log.ftl }}
            - name: FTLCONF_files_log_ftl
              value: {{ .Values.pihole.ftl.files.log.ftl | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.files.log.dnsmasq }}
            - name: FTLCONF_files_log_dnsmasq
              value: {{ .Values.pihole.ftl.files.log.dnsmasq | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.files.log.webserver }}
            - name: FTLCONF_files_log_webserver
              value: {{ .Values.pihole.ftl.files.log.webserver | quote }}
            {{- end }}

            # ------------------------------------------------------
            # [misc]
            # ------------------------------------------------------
            {{- if hasKey .Values.pihole.ftl.misc "privacylevel" }}
            - name: FTLCONF_misc_privacylevel
              value: {{ .Values.pihole.ftl.misc.privacylevel | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.misc "delay_startup" }}
            - name: FTLCONF_misc_delay_startup
              value: {{ .Values.pihole.ftl.misc.delay_startup | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.misc "nice" }}
            - name: FTLCONF_misc_nice
              value: {{ .Values.pihole.ftl.misc.nice | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.misc "addr2line" }}
            - name: FTLCONF_misc_addr2line
              value: {{ .Values.pihole.ftl.misc.addr2line | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.misc "etc_dnsmasq_d" }}
            - name: FTLCONF_misc_etc_dnsmasq_d
              value: {{ .Values.pihole.ftl.misc.etc_dnsmasq_d | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.misc.dnsmasq_lines }}
            - name: FTLCONF_misc_dnsmasq_lines
              value: {{ .Values.pihole.ftl.misc.dnsmasq_lines | join "\n" | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.misc "extraLogging" }}
            - name: FTLCONF_misc_extraLogging
              value: {{ .Values.pihole.ftl.misc.extraLogging | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.misc "readOnly" }}
            - name: FTLCONF_misc_readOnly
              value: {{ .Values.pihole.ftl.misc.readOnly | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.misc "normalizeCPU" }}
            - name: FTLCONF_misc_normalizeCPU
              value: {{ .Values.pihole.ftl.misc.normalizeCPU | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.misc "hide_dnsmasq_warn" }}
            - name: FTLCONF_misc_hide_dnsmasq_warn
              value: {{ .Values.pihole.ftl.misc.hide_dnsmasq_warn | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.misc.check "load" }}
            - name: FTLCONF_misc_check_load
              value: {{ .Values.pihole.ftl.misc.check.load | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.misc.check "shmem" }}
            - name: FTLCONF_misc_check_shmem
              value: {{ .Values.pihole.ftl.misc.check.shmem | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.misc.check "disk" }}
            - name: FTLCONF_misc_check_disk
              value: {{ .Values.pihole.ftl.misc.check.disk | quote }}
            {{- end }}

            # User/Permission Logic
            {{- if hasKey .Values.pihole "uid" }}
            - name: PIHOLE_UID
              value: {{ .Values.pihole.uid | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole "gid" }}
            - name: PIHOLE_GID
              value: {{ .Values.pihole.gid | quote }}
            {{- end }}
            
            # ------------------------------------------------------
            # Other Pi-hole Variables
            # ------------------------------------------------------
            {{- if hasKey .Values.pihole "tailFtlLog" }}
            - name: TAIL_FTL_LOG
              value: {{ .Values.pihole.tailFtlLog | quote }}
            {{- end }}
            {{- if .Values.pihole.ftlCmd }}
            - name: FTL_CMD
              value: {{ .Values.pihole.ftlCmd | quote }}
            {{- end }}
            {{- if .Values.pihole.dnsmasqUser }}
            - name: DNSMASQ_USER
              value: {{ .Values.pihole.dnsmasqUser | quote }}
            {{- end }}
            {{- if .Values.pihole.additionalPackages }}
            - name: ADDITIONAL_PACKAGES
              value: {{ .Values.pihole.additionalPackages | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole "verbose" }}
            - name: PH_VERBOSE
              value: {{ .Values.pihole.verbose | quote }}
            {{- end }}
            
            # Web Password (Generated or from Secret)
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.pihole.web.existingSecret }}{{ .Values.pihole.web.existingSecret }}{{ else }}{{ include "pihole.fullname" . }}-web-password{{ end }}
                  key: {{ .Values.pihole.web.passwordSecretKey }}
          
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: dhcp
              containerPort: 67
              protocol: UDP

          livenessProbe:
            exec:
              command:
                - dig
                - -p
                - "53"
                - +short
                - +norecurse
                - "@127.0.0.1"
                - pi.hole
            initialDelaySeconds: 60
            periodSeconds: 30
          
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
          
          volumeMounts:
            {{- if .Values.persistence.etcPihole.enabled }}
            - name: etc-pihole
              mountPath: /etc/pihole
            {{- end }}
            {{- if .Values.persistence.etcDnsmasq.enabled }}
            - name: etc-dnsmasq
              mountPath: /etc/dnsmasq.d
            {{- end }}
            - name: lists
              mountPath: /usr/local/bin/import-lists.sh
              subPath: import-lists.sh
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

        # METRICS SIDECAR (ekofr/pihole-exporter)
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: "{{ .Values.metrics.image.repository }}:{{ .Values.metrics.image.tag }}"
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          env:
            {{- if .Values.metrics.env }}
            {{- toYaml .Values.metrics.env | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
        {{- end }}

      volumes:
        {{- if .Values.persistence.etcPihole.enabled }}
        - name: etc-pihole
          persistentVolumeClaim:
            claimName: {{ include "pihole.fullname" . }}-etc-pihole
        {{- end }}
        {{- if .Values.persistence.etcDnsmasq.enabled }}
        - name: etc-dnsmasq
          persistentVolumeClaim:
            claimName: {{ include "pihole.fullname" . }}-etc-dnsmasq
        {{- end }}
        - name: lists
          configMap:
            name: {{ include "pihole.fullname" . }}-lists
            defaultMode: 0755
      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}