            - name: FTLCONF_dns_specialDomains_designatedResolver
              value: {{ .Values.pihole.ftl.dns.specialDomains.designatedResolver | quote }}
            {{- end }}

            # [dns.reply]
            {{- if hasKey .Values.pihole.ftl.dns.reply.host "force4" }}
            - name: FTLCONF_dns_reply_host_force4
              value: {{ .Values.pihole.ftl.dns.reply.host.force4 | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dns.reply.host.IPv4 }}
            - name: FTLCONF_dns_reply_host_IPv4
              value: {{ .Values.pihole.ftl.dns.reply.host.IPv4 | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.dns.reply.host "force6" }}
            - name: FTLCONF_dns_reply_host_force6
              value: {{ .Values.pihole.ftl.dns.reply.host.force6 | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dns.reply.host.IPv6 }}
            - name: FTLCONF_dns_reply_host_IPv6
              value: {{ .Values.pihole.ftl.dns.reply.host.IPv6 | quote }}
