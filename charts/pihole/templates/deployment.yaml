apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pihole.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "pihole.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pihole.selectorLabels" . | nindent 8 }}
{{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "pihole.fullname" .) | quote }}
      hostNetwork: {{ .Values.networking.hostNetwork }}
{{- if .Values.networking.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
{{- else }}
      dnsPolicy: ClusterFirst
{{- end }}
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
{{- end }}
      
{{- if or .Values.extraInitContainers (and .Values.metrics.enabled .Values.metrics.initContainer) }}
      initContainers:
  {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
  {{- end }}
  {{- if and .Values.metrics.enabled .Values.metrics.initContainer }}
        {{- toYaml .Values.metrics.initContainer | nindent 8 }}
  {{- end }}
{{- end }}
      
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
{{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
{{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: {{ .Values.pihole.uid | default 1000 }} 
            runAsGroup: {{ .Values.pihole.gid | default 1000 }}
            capabilities:
              drop:
                  - ALL
              add:
                # Essential: Bind to port 53 (DNS)
                - NET_BIND_SERVICE
                
                # Recommended by Pi-hole Docs:
                - SYS_TIME  # For internal NTP time syncing
                - SYS_NICE  # For process priority (FTL is "important")
                - CHOWN     # For log/database file ownership changes
                
                # Conditional: DHCP & IPv6 Requirements
                # Only added if DHCP service is enabled or HostNetwork is used
{{- if or .Values.pihole.ftl.dhcp.service.enabled .Values.networking.hostNetwork }}
                - NET_ADMIN # Required for DHCP & modifying routing tables
                - NET_RAW   # Required for DHCPv6 & collision checks
{{- end }}
{{- with .Values.securityContext.capabilities.add }}
  {{- range . }}
                - {{ . }}
  {{- end }}
{{- end }}
          lifecycle:
            postStart:
              exec:
                command: ["/bin/bash", "/usr/local/bin/import-lists.sh"]
          env:
{{- if .Values.timezone }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
{{- end }}
            
{{- with .Values.pihole.ftl }}
            # ------------------------------------------------------
            # [dns]
            # ------------------------------------------------------
  {{- with .dns }}
    {{- if .upstreams }}
            - name: FTLCONF_dns_upstreams
              value: {{ .upstreams | join ";" | quote }}
    {{- end }}
    {{- if hasKey . "CNAMEdeepInspect" }}
            - name: FTLCONF_dns_CNAMEdeepInspect
              value: {{ .CNAMEdeepInspect | quote }}
    {{- end }}
    {{- if hasKey . "blockESNI" }}
            - name: FTLCONF_dns_blockESNI
              value: {{ .blockESNI | quote }}
    {{- end }}
    {{- if hasKey . "EDNS0ECS" }}
            - name: FTLCONF_dns_EDNS0ECS
              value: {{ .EDNS0ECS | quote }}
    {{- end }}
    {{- if hasKey . "ignoreLocalhost" }}
            - name: FTLCONF_dns_ignoreLocalhost
              value: {{ .ignoreLocalhost | quote }}
    {{- end }}
    {{- if hasKey . "showDNSSEC" }}
            - name: FTLCONF_dns_showDNSSEC
              value: {{ .showDNSSEC | quote }}
    {{- end }}
    {{- if hasKey . "analyzeOnlyAandAAAA" }}
            - name: FTLCONF_dns_analyzeOnlyAandAAAA
              value: {{ .analyzeOnlyAandAAAA | quote }}
    {{- end }}
    {{- if .piholePTR }}
            - name: FTLCONF_dns_piholePTR
              value: {{ .piholePTR | quote }}
    {{- end }}
    {{- if .replyWhenBusy }}
