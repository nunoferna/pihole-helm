apiVersion: apps/v1
kind: {{ include "pihole.workloadKind" . }}
metadata:
  name: {{ include "pihole.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/drop-net-raw-capability: "Pi-hole requires NET_RAW capability for DHCP operations"
    ignore-check.kube-linter.io/no-read-only-root-fs: "Pi-hole needs write access to filesystem for configuration and logs"
    ignore-check.kube-linter.io/run-as-non-root: "Pi-hole requires specific UID/GID configuration for proper operation"
spec:
  replicas: {{ .Values.replicas }}
{{- if eq (include "pihole.isStatefulSet" .) "true" }}
  serviceName: {{ include "pihole.fullname" . }}-headless
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
{{- else }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
{{- end }}
  selector:
    matchLabels:
      {{- include "pihole.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pihole.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/lists: {{ include (print $.Template.BasePath "/configmap-lists.yaml") . | sha256sum }}
        checksum/env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
{{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "pihole.fullname" .) | quote }}
      hostNetwork: {{ .Values.networking.hostNetwork }}
{{- if .Values.networking.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
{{- else }}
      dnsPolicy: ClusterFirst
{{- end }}
{{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
{{- end }}

{{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
{{- end }}

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
{{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- $securityContext := .Values.securityContext | default dict }}
{{- $capabilities := $securityContext.capabilities | default dict }}
{{- $capAdd := $capabilities.add | default (list) }}
{{- $capDrop := $capabilities.drop | default (list) }}
{{- $hasDynamicCaps := or .Values.pihole.ftl.dhcp.service.enabled .Values.networking.hostNetwork }}
{{- $hasCaps := or $hasDynamicCaps (gt (len $capAdd) 0) (gt (len $capDrop) 0) }}
{{- if or (omit $securityContext "capabilities") $hasCaps }}
          securityContext:
  {{- with (omit $securityContext "capabilities") }}
            {{- toYaml . | nindent 12 }}
  {{- end }}
  {{- if $hasCaps }}
            capabilities:
    {{- with $capDrop }}
              drop:
                {{- toYaml . | nindent 16 }}
    {{- end }}
    {{- if or $hasDynamicCaps (gt (len $capAdd) 0) }}
              add:
      {{- if or .Values.pihole.ftl.dhcp.service.enabled .Values.networking.hostNetwork }}
                - NET_ADMIN # Required for DHCP & modifying routing tables
                - NET_RAW   # Required for DHCPv6 & collision checks
      {{- end }}
      {{- range $capAdd }}
                - {{ . }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
          lifecycle:
            postStart:
              exec:
                command: ["/bin/bash", "/usr/local/bin/import-lists.sh"]
          envFrom:
            - configMapRef:
                name: {{ include "pihole.fullname" . }}-env
{{- if or (not .Values.pihole.web.skipPasswordEnv) .Values.extraEnv }}
          env:
  {{- if not .Values.pihole.web.skipPasswordEnv }}
            # Web Password (Generated or from Secret)
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.pihole.web.existingSecret }}{{ .Values.pihole.web.existingSecret }}{{ else }}{{ include "pihole.fullname" . }}-web-password{{ end }}
                  key: {{ .Values.pihole.web.passwordSecretKey }}
  {{- end }}


  {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
  {{- end }}
{{- end }}
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: dhcp
              containerPort: 67
              protocol: UDP
            - name: dhcpv6
              containerPort: 547
              protocol: UDP
            - name: ntp
              containerPort: 123
              protocol: UDP

          livenessProbe:
            exec:
              command:
                - dig
                - -p
                - "53"
                - +short
                - +norecurse
                - "@127.0.0.1"
                - pi.hole
            initialDelaySeconds: 60
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /admin/
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10

          volumeMounts:
{{- if .Values.persistence.etcPihole.enabled }}
            - name: etc-pihole
              mountPath: /etc/pihole
{{- end }}
{{- if .Values.persistence.etcDnsmasq.enabled }}
            - name: etc-dnsmasq
              mountPath: /etc/dnsmasq.d
{{- end }}
            - name: lists
              mountPath: /usr/local/bin/import-lists.sh
              subPath: import-lists.sh
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
{{- if and (not (include "pihole.isStatefulSet" .)) .Values.persistence.etcPihole.enabled }}
        - name: etc-pihole
          persistentVolumeClaim:
            claimName: {{ include "pihole.fullname" . }}-etc-pihole
{{- end }}
{{- if and (not (include "pihole.isStatefulSet" .)) .Values.persistence.etcDnsmasq.enabled }}
        - name: etc-dnsmasq
          persistentVolumeClaim:
            claimName: {{ include "pihole.fullname" . }}-etc-dnsmasq
{{- end }}
        - name: lists
          configMap:
            name: {{ include "pihole.fullname" . }}-lists
            defaultMode: 0755
{{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
{{- end }}

{{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- if eq (include "pihole.isStatefulSet" .) "true" }}
  volumeClaimTemplates:
  {{- if .Values.persistence.etcPihole.enabled }}
    - metadata:
        name: etc-pihole
        labels:
          {{- include "pihole.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.etcPihole.accessMode }}
    {{- if .Values.persistence.etcPihole.storageClassName }}
        storageClassName: {{ .Values.persistence.etcPihole.storageClassName | quote }}
    {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.etcPihole.size }}
  {{- end }}
  {{- if .Values.persistence.etcDnsmasq.enabled }}
    - metadata:
        name: etc-dnsmasq
        labels:
          {{- include "pihole.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.etcDnsmasq.accessMode }}
    {{- if .Values.persistence.etcDnsmasq.storageClassName }}
        storageClassName: {{ .Values.persistence.etcDnsmasq.storageClassName | quote }}
    {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.etcDnsmasq.size }}
  {{- end }}
{{- end }}
