            {{- if .Values.pihole.ftl.webserver.advancedOpts }}
            - name: FTLCONF_webserver_advancedOpts
              value: {{ .Values.pihole.ftl.webserver.advancedOpts | join "\n" | quote }}
            {{- end }}
            
            {{- if hasKey .Values.pihole.ftl.webserver.session "timeout" }}
            - name: FTLCONF_webserver_session_timeout
              value: {{ .Values.pihole.ftl.webserver.session.timeout | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.webserver.session "restore" }}
            - name: FTLCONF_webserver_session_restore
              value: {{ .Values.pihole.ftl.webserver.session.restore | quote }}
            {{- end }}

            {{- if .Values.pihole.ftl.webserver.tls.cert }}
            - name: FTLCONF_webserver_tls_cert
              value: {{ .Values.pihole.ftl.webserver.tls.cert | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.webserver.tls "validity" }}
            - name: FTLCONF_webserver_tls_validity
