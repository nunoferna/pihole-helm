            {{- end }}
            {{- if hasKey .Values.pihole.ftl.webserver "port" }}
            - name: FTLCONF_webserver_port
              value: {{ .Values.pihole.ftl.webserver.port | quote }}
            {{- end }}
            {{- if hasKey .Values.pihole.ftl.webserver "threads" }}
            - name: FTLCONF_webserver_threads
