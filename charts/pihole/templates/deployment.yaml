    {{- end }}
    {{- if not (kindIs "invalid" .expandHosts) }}
            - name: FTLCONF_dns_expandHosts
              value: {{ .expandHosts | quote }}
    {{- end }}
    {{- if not (kindIs "invalid" .bogusPriv) }}
            - name: FTLCONF_dns_bogusPriv
              value: {{ .bogusPriv | quote }}
    {{- end }}
    {{- if not (kindIs "invalid" .dnssec) }}
