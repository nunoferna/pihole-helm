    {{- end }}
    {{- if not (kindIs "invalid" .logging) }}
            - name: FTLCONF_dhcp_logging
              value: {{ .logging | quote }}
    {{- end }}
    {{- if not (kindIs "invalid" .ignoreUnknownClients) }}
            - name: FTLCONF_dhcp_ignoreUnknownClients
              value: {{ .ignoreUnknownClients | quote }}
    {{- end }}
    {{- if .hosts }}
            - name: FTLCONF_dhcp_hosts
