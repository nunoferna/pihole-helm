            {{- if hasKey .Values.pihole.ftl.dns.rateLimit "interval" }}
            - name: FTLCONF_dns_rateLimit_interval
              value: {{ .Values.pihole.ftl.dns.rateLimit.interval | quote }}
            {{- end }}

            # ------------------------------------------------------
            # [dhcp]
            # ------------------------------------------------------
            {{- if hasKey .Values.pihole.ftl.dhcp "active" }}
            - name: FTLCONF_dhcp_active
              value: {{ .Values.pihole.ftl.dhcp.active | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dhcp.start }}
            - name: FTLCONF_dhcp_start
              value: {{ .Values.pihole.ftl.dhcp.start | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dhcp.end }}
            - name: FTLCONF_dhcp_end
              value: {{ .Values.pihole.ftl.dhcp.end | quote }}
            {{- end }}
            {{- if .Values.pihole.ftl.dhcp.router }}
            - name: FTLCONF_dhcp_router
