{{- if hasKey .Values.pihole "uid" }}
            - name: PIHOLE_UID
              value: {{ .Values.pihole.uid | quote }}
{{- end }}
{{- if hasKey .Values.pihole "gid" }}
            - name: PIHOLE_GID
              value: {{ .Values.pihole.gid | quote }}
{{- end }}
            
            # ------------------------------------------------------
            # Other Pi-hole Variables
            # ------------------------------------------------------
{{- if hasKey .Values.pihole "tailFtlLog" }}
            - name: TAIL_FTL_LOG
              value: {{ .Values.pihole.tailFtlLog | quote }}
{{- end }}
{{- if .Values.pihole.ftlCmd }}
            - name: FTL_CMD
              value: {{ .Values.pihole.ftlCmd | quote }}
{{- end }}
{{- if .Values.pihole.dnsmasqUser }}
            - name: DNSMASQ_USER
              value: {{ .Values.pihole.dnsmasqUser | quote }}
{{- end }}
{{- if .Values.pihole.additionalPackages }}
            - name: ADDITIONAL_PACKAGES
              value: {{ .Values.pihole.additionalPackages | quote }}
{{- end }}
{{- if hasKey .Values.pihole "verbose" }}
            - name: PH_VERBOSE
              value: {{ .Values.pihole.verbose | quote }}
{{- end }}
            
            # Web Password (Generated or from Secret)
{{- if not .Values.pihole.web.skipPasswordEnv }}
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.pihole.web.existingSecret }}{{ .Values.pihole.web.existingSecret }}{{ else }}{{ include "pihole.fullname" . }}-web-password{{ end }}
                  key: {{ .Values.pihole.web.passwordSecretKey }}
{{- end }}
          
{{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
{{- end }}
          
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: dhcp
              containerPort: 67
              protocol: UDP
            - name: dhcpv6
              containerPort: 547
              protocol: UDP
            - name: ntp
              containerPort: 123
              protocol: UDP

          livenessProbe:
            exec:
              command:
                - dig
                - -p
                - "53"
                - +short
                - +norecurse
                - "@127.0.0.1"
                - pi.hole
            initialDelaySeconds: 60
            periodSeconds: 30
          
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
          
          volumeMounts:
            - name: run-dir
              mountPath: /run
            - name: log-dir
              mountPath: /var/log/pihole
{{- if .Values.persistence.etcPihole.enabled }}
            - name: etc-pihole
              mountPath: /etc/pihole
{{- end }}
{{- if .Values.persistence.etcDnsmasq.enabled }}
            - name: etc-dnsmasq
              mountPath: /etc/dnsmasq.d
{{- end }}
            - name: lists
              mountPath: /usr/local/bin/import-lists.sh
              subPath: import-lists.sh
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

        # METRICS SIDECAR (ekofr/pihole-exporter)
{{- if .Values.metrics.enabled }}
        - name: metrics
          image: "{{ .Values.metrics.image.repository }}:{{ .Values.metrics.image.tag }}"
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
  {{- with .Values.metrics.command }}
          command:
            {{- toYaml . | nindent 12 }}
  {{- end }}
  {{- with .Values.metrics.args }}
          args:
            {{- toYaml . | nindent 12 }}
  {{- end }}
          env:
  {{- if .Values.metrics.env }}
            {{- toYaml .Values.metrics.env | nindent 12 }}
  {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
  {{- with .Values.metrics.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
  {{- end }}
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
{{- end }}

      volumes:
        - name: run-dir
          emptyDir: {}
        - name: log-dir
          emptyDir: {}
{{- if .Values.persistence.etcPihole.enabled }}
        - name: etc-pihole
          persistentVolumeClaim:
            claimName: {{ include "pihole.fullname" . }}-etc-pihole
{{- end }}
{{- if .Values.persistence.etcDnsmasq.enabled }}
        - name: etc-dnsmasq
          persistentVolumeClaim:
            claimName: {{ include "pihole.fullname" . }}-etc-dnsmasq
{{- end }}
        - name: lists
          configMap:
            name: {{ include "pihole.fullname" . }}-lists
            defaultMode: 0755
{{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
{{- end }}
      
{{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
{{- end }}
