{{- if .Values.metrics.enabled }}
  {{- $compatibility := .Files.Get "files/compatibility.json" | fromJson }}
  {{- $userEnvKeys := dict }}
  {{- range .Values.metrics.env }}
    {{- $_ := set $userEnvKeys .name true }}
  {{- end }}
  {{- $automaticAuth := and (not .Values.pihole.web.skipPasswordEnv) (not (or (hasKey $userEnvKeys "PIHOLE_PASSWORD") (hasKey $userEnvKeys "PIHOLE_PASSWORD_FILE"))) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pihole.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pihole.metricsSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pihole.metricsSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/credentials: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        credentials-revision: {{ .Values.credentialsRevision | quote }}
  {{- with .Values.metrics.podAnnotations }}
        {{- toYaml . | nindent 8 }}
  {{- end }}
    spec:
  {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  {{- with .Values.metrics.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  {{- with .Values.metrics.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  {{- with .Values.metrics.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
  {{- end }}
      serviceAccountName: {{ include "pihole.serviceAccountName" . | quote }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
  {{- if $automaticAuth }}
      volumes:
        - name: exporter-auth
          secret:
            secretName: {{ include "pihole.passwordSecretName" . | quote }}
            items:
              - key: {{ .Values.pihole.web.passwordSecretKey }}
                path: password
  {{- end }}
  {{- with .Values.metrics.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
  {{- end }}
      containers:
        - name: metrics
          image: {{ include "pihole.image" (dict "image" .Values.metrics.image "defaultTag" $compatibility.exporterTag) | quote }}
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
  {{- with .Values.metrics.command }}
          command:
            {{- toYaml . | nindent 12 }}
  {{- end }}
  {{- with .Values.metrics.args }}
          args:
            {{- toYaml . | nindent 12 }}
  {{- end }}
  {{- with .Values.metrics.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
  {{- end }}
          env:
  {{- if not (hasKey $userEnvKeys "PIHOLE_HOSTNAME") }}
            - name: PIHOLE_HOSTNAME
              value: {{ include "pihole.metricsHostnames" . | quote }}
  {{- end }}
  {{- if not (hasKey $userEnvKeys "PIHOLE_PORT") }}
            - name: PIHOLE_PORT
              value: {{ include "pihole.metricsPorts" . | quote }}
  {{- end }}
  {{- if not (hasKey $userEnvKeys "PIHOLE_PROTOCOL") }}
            - name: PIHOLE_PROTOCOL
              value: {{ include "pihole.metricsProtocols" . | quote }}
  {{- end }}
  {{- if not (hasKey $userEnvKeys "PORT") }}
            - name: PORT
              value: {{ .Values.metrics.port | quote }}
  {{- end }}
  {{- if $automaticAuth }}
            - name: PIHOLE_PASSWORD_FILE
              value: /etc/pihole-exporter-auth/password
  {{- end }}
  {{- range .Values.metrics.env }}
            - name: {{ .name }}
              {{- omit . "name" | toYaml | nindent 14 }}
  {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
  {{- if $automaticAuth }}
          volumeMounts:
            - name: exporter-auth
              mountPath: /etc/pihole-exporter-auth
              readOnly: true
  {{- end }}
          livenessProbe:
            httpGet:
              path: /liveness
              port: metrics
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /readiness
              port: metrics
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
{{- end }}
