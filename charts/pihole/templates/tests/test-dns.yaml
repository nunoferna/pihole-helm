{{- if and .Values.pihole.ftl.dns.service.enabled (or (not .Values.pihole.ftl.dns.service.splitTcpUdp) .Values.pihole.ftl.dns.service.udp.enabled) }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pihole.fullname" . }}-test-dns"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test-dns
      image: busybox:1.37
      command: ['nslookup']
      args: ['google.com', '{{ include "pihole.fullname" . }}-dns{{ if .Values.pihole.ftl.dns.service.splitTcpUdp }}-udp{{ end }}']
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
  restartPolicy: Never
{{- end }}
