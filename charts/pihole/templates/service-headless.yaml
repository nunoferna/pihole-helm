{{- if eq (include "pihole.isStatefulSet" .) "true" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pihole.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "pihole.selectorLabels" . | nindent 4 }}
  ports:
    - name: dns-tcp
      port: {{ .Values.listeners.dns }}
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: {{ .Values.listeners.dns }}
      targetPort: dns-udp
      protocol: UDP
    - name: http
      port: {{ .Values.listeners.http }}
      targetPort: http
      protocol: TCP
{{- end }}
