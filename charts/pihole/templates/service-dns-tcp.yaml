{{- if and .Values.services.dns.enabled .Values.services.dns.splitTcpUdp .Values.services.dns.tcp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pihole.fullname" . }}-dns-tcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
    app.kubernetes.io/component: dns-tcp
  annotations:
    {{- toYaml .Values.services.dns.tcp.annotations | nindent 4 }}
spec:
  type: {{ .Values.services.dns.tcp.type }}
  {{- include "pihole.loadBalancerFields" .Values.services.dns.tcp | nindent 2 }}
  {{- if or (eq .Values.services.dns.tcp.type "LoadBalancer") (eq .Values.services.dns.tcp.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.services.dns.tcp.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.services.dns.tcp.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.services.dns.tcp.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.services.dns.tcp.port }}
      targetPort: dns-tcp
      protocol: TCP
      name: dns-tcp
  {{- if and (eq .Values.services.dns.tcp.type "NodePort") .Values.services.dns.tcp.nodePort }}
      nodePort: {{ .Values.services.dns.tcp.nodePort }}
  {{- end }}
  selector:
    {{- include "pihole.selectorLabels" . | nindent 4 }}
{{- end }}
