{{- if .Values.pihole.web.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pihole.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.pihole.web.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.pihole.web.service.type }}
  {{- if or (eq .Values.pihole.web.service.type "LoadBalancer") (eq .Values.pihole.web.service.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.pihole.web.service.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.pihole.web.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.pihole.web.service.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.pihole.web.service.ports.http }}
      targetPort: http
      protocol: TCP
      name: http
  {{- if and (eq .Values.pihole.web.service.type "NodePort") .Values.pihole.web.service.nodePorts.http }}
      nodePort: {{ .Values.pihole.web.service.nodePorts.http }}
  {{- end }}
    - port: {{ .Values.pihole.web.service.ports.https }}
      targetPort: https
      protocol: TCP
      name: https
  {{- if and (eq .Values.pihole.web.service.type "NodePort") .Values.pihole.web.service.nodePorts.https }}
      nodePort: {{ .Values.pihole.web.service.nodePorts.https }}
  {{- end }}
  selector:
    {{- include "pihole.selectorLabels" . | nindent 4 }}
  {{- if eq (include "pihole.isStatefulSet" .) "true" }}
    statefulset.kubernetes.io/pod-name: {{ include "pihole.fullname" . }}-0
  {{- end }}
{{- end }}
