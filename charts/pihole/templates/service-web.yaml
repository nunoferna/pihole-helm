{{- if .Values.services.web.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pihole.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/dangling-service: "The StatefulSet controller assigns the pod-name label; this administration Service intentionally selects ordinal 0."
  {{- with .Values.services.web.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.services.web.type }}
  {{- include "pihole.loadBalancerFields" .Values.services.web | nindent 2 }}
  {{- if or (eq .Values.services.web.type "LoadBalancer") (eq .Values.services.web.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.services.web.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.services.web.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.services.web.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.services.web.ports.http }}
      targetPort: http
      protocol: TCP
      name: http
  {{- with (get (.Values.services.web.nodePorts | default dict) "http") }}
    {{- if eq $.Values.services.web.type "NodePort" }}
      nodePort: {{ . }}
    {{- end }}
  {{- end }}
  {{- if gt (int .Values.listeners.https) 0 }}
    - port: {{ .Values.services.web.ports.https }}
      targetPort: https
      protocol: TCP
      name: https
    {{- with (get (.Values.services.web.nodePorts | default dict) "https") }}
      {{- if eq $.Values.services.web.type "NodePort" }}
      nodePort: {{ . }}
      {{- end }}
    {{- end }}
  {{- end }}
  selector:
    {{- include "pihole.selectorLabels" . | nindent 4 }}
  {{- if eq (include "pihole.isStatefulSet" .) "true" }}
    statefulset.kubernetes.io/pod-name: {{ include "pihole.fullname" . }}-0
  {{- end }}
{{- end }}
