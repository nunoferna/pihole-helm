apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pihole.fullname" . }}-lists
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
data:
  import-lists.sh: |
    #!/bin/bash
    LOG_FILE="/etc/pihole/helm-import.log"
    exec > "$LOG_FILE" 2>&1
    set +e

    echo "[Helm Hook] Starting Import Script..."

    # --- STEP 1: Wait for pihole-FTL Process ---
    # We wait for the process first. This implies the container's entrypoint 
    # has finished its pre-flight checks and started the main service.
    echo "[Helm Hook] Step 1: Waiting for pihole-FTL process to start..."
    while ! pidof pihole-FTL > /dev/null; do
       # Wait indefinitely until FTL is up
       sleep 2
    done
    echo "[Helm Hook] pihole-FTL process found."

    # --- STEP 2: pihole-FTL Binary Detection ---
    echo "[Helm Hook] Step 2: Detecting pihole-FTL binary..."
    if command -v pihole-FTL >/dev/null 2>&1; then
       FTL_CMD=$(command -v pihole-FTL)
    else
       FTL_CMD="/usr/bin/pihole-FTL"
    fi
    echo "[Helm Hook] Using FTL binary at: $FTL_CMD"

    # --- STEP 3: Check DB Creation ---
    GRAVITY_DB="/etc/pihole/gravity.db"
    # Define our SQL helper command now that we have the binary and path
    SQL_CMD="$FTL_CMD sqlite3 -ni $GRAVITY_DB"

    echo "[Helm Hook] Step 3: Checking if gravity.db exists..."
    # Although FTL is running, we double check the file is accessible
    while [ ! -f "$GRAVITY_DB" ]; do
       echo "[Helm Hook] gravity.db not found yet. Waiting..."
       sleep 2
    done
    echo "[Helm Hook] gravity.db found."

    # --- STEP 4: Check abp_domains (Schema Check) ---
    # FTL might be running, but it could still be performing the initial migration.
    # We query the 'info' table for 'abp_domains' to confirm the DB is unlocked and valid.
    echo "[Helm Hook] Step 4: Verifying database schema (abp_domains)..."
    
    while true; do
       if $SQL_CMD "SELECT value FROM info WHERE property = 'abp_domains';" >/dev/null 2>&1; then
          echo "[Helm Hook] Schema verification passed (abp_domains found)."
          break
       fi
       echo "[Helm Hook] Database locked or schema not ready. Waiting..."
       sleep 2
    done

    echo "[Helm Hook] Waiting 5s for FTL to settle..."
    sleep 5

    # --- STEP 5: Import Lists ---
    echo "[Helm Hook] Database is ready. Starting List Import..."

    function add_to_db() {
       local retries=0
       local max_retries=30
       
       while true; do
          if $SQL_CMD "$1"; then
             return 0
          fi
          
          echo "[Helm Hook] Database busy/locked, retrying..."
          sleep 1
          retries=$((retries+1))
          if [ $retries -ge $max_retries ]; then
             echo "[Helm Hook] ERROR: Timed out executing SQL."
             exit 1
          fi
       done
    }

{{- range .Values.pihole.lists.adlists }}
    add_to_db "INSERT OR IGNORE INTO adlist (address, enabled, comment) VALUES ('{{ .address }}', {{ if eq .enabled false }}0{{ else }}1{{ end }}, '{{ .comment | default "Helm-Import" }}');"
{{- end }}

{{- range .Values.pihole.lists.whitelist }}
    add_to_db "INSERT OR IGNORE INTO domainlist (type, domain, enabled, comment) VALUES (0, '{{ .domain }}', {{ if eq .enabled false }}0{{ else }}1{{ end }}, '{{ .comment | default "Helm-Import" }}');"
{{- end }}

{{- range .Values.pihole.lists.blacklist }}
    add_to_db "INSERT OR IGNORE INTO domainlist (type, domain, enabled, comment) VALUES (1, '{{ .domain }}', {{ if eq .enabled false }}0{{ else }}1{{ end }}, '{{ .comment | default "Helm-Import" }}');"
{{- end }}

{{- range .Values.pihole.lists.regex_whitelist }}
    add_to_db "INSERT OR IGNORE INTO domainlist (type, domain, enabled, comment) VALUES (2, '{{ .domain }}', {{ if eq .enabled false }}0{{ else }}1{{ end }}, '{{ .comment | default "Helm-Import" }}');"
{{- end }}

{{- range .Values.pihole.lists.regex_blacklist }}
    add_to_db "INSERT OR IGNORE INTO domainlist (type, domain, enabled, comment) VALUES (3, '{{ .domain }}', {{ if eq .enabled false }}0{{ else }}1{{ end }}, '{{ .comment | default "Helm-Import" }}');"
{{- end }}

    echo "[Helm Hook] Import complete."

    echo "[Helm Hook] Validating database is free for Gravity update..."
    # We attempt to start a dummy transaction. If FTL is writing, this will fail.
    # We wait until we get a clean "OK" from the DB.
    while true; do
       if $SQL_CMD "BEGIN IMMEDIATE; ROLLBACK;" >/dev/null 2>&1; then
          echo "[Helm Hook] Database is unlocked and writable."
          break
       fi
       echo "[Helm Hook] Database is currently locked by FTL. Waiting..."
       sleep 2
    done

    echo "[Helm Hook] Running 'pihole -g' to update gravity..."
    
    if pihole -g; then
       echo "[Helm Hook] Gravity updated successfully."
    else
       echo "[Helm Hook] WARNING: 'pihole -g' returned a non-zero exit code."
    fi

    echo "[Helm Hook] Finished."
    exit 0
