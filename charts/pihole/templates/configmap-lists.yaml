{{- if and (eq (include "pihole.hasPolicy" .) "true") (not .Values.policy.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pihole.policyConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy
  annotations:
    helm.sh/resource-policy: keep
    pihole-helm/policy-revision: {{ include "pihole.policyRevision" . | quote }}
immutable: true
data:
  policy.json: {{ include "pihole.policyDocument" . | quote }}
  import-lists.sh: |
    {{- .Files.Get "files/import-lists.sh" | nindent 4 }}
  policy.jq: |
    {{- .Files.Get "files/policy.jq" | nindent 4 }}
{{- end }}
