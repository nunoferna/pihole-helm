apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pihole.fullname" . }}-lists
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
data:
  99-helm-lists.sh: |
    #!/bin/bash
    set -e
    
    GRAVITY_DB="/etc/pihole/gravity.db"
    
    echo "[Helm] Starting Custom List Configuration..."
    
    # 1. Adlists (Blocklists)
    {{- range .Values.pihole.lists.adlists }}
    # Default enabled to 1 (true) unless explicitly set to false
    pihole-FTL sqlite3 "$GRAVITY_DB" "INSERT OR IGNORE INTO adlist (address, enabled, comment) VALUES ('{{ .address }}', {{ if eq .enabled false }}0{{ else }}1{{ end }}, '{{ .comment | default "Helm-Import" }}');"
    {{- end }}

    # 2. Exact Whitelist (Type 0)
    {{- range .Values.pihole.lists.whitelist }}
    pihole-FTL sqlite3 "$GRAVITY_DB" "INSERT OR IGNORE INTO domainlist (type, domain, enabled, comment) VALUES (0, '{{ .domain }}', {{ if eq .enabled false }}0{{ else }}1{{ end }}, '{{ .comment | default "Helm-Import" }}');"
    {{- end }}

    # 3. Exact Blacklist (Type 1)
    {{- range .Values.pihole.lists.blacklist }}
    pihole-FTL sqlite3 "$GRAVITY_DB" "INSERT OR IGNORE INTO domainlist (type, domain, enabled, comment) VALUES (1, '{{ .domain }}', {{ if eq .enabled false }}0{{ else }}1{{ end }}, '{{ .comment | default "Helm-Import" }}');"
    {{- end }}

    # 4. Regex Whitelist (Type 2)
    {{- range .Values.pihole.lists.regex_whitelist }}
    pihole-FTL sqlite3 "$GRAVITY_DB" "INSERT OR IGNORE INTO domainlist (type, domain, enabled, comment) VALUES (2, '{{ .domain }}', {{ if eq .enabled false }}0{{ else }}1{{ end }}, '{{ .comment | default "Helm-Import" }}');"
    {{- end }}

    # 5. Regex Blacklist (Type 3)
    {{- range .Values.pihole.lists.regex_blacklist }}
    pihole-FTL sqlite3 "$GRAVITY_DB" "INSERT OR IGNORE INTO domainlist (type, domain, enabled, comment) VALUES (3, '{{ .domain }}', {{ if eq .enabled false }}0{{ else }}1{{ end }}, '{{ .comment | default "Helm-Import" }}');"
    {{- end }}

    echo "[Helm] Updating Gravity..."
    pihole -g