{{- if .Values.services.dhcpv6.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pihole.fullname" . }}-dhcpv6
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.services.dhcpv6.annotations | nindent 4 }}
spec:
  type: {{ .Values.services.dhcpv6.type }}
  {{- if or (eq .Values.services.dhcpv6.type "LoadBalancer") (eq .Values.services.dhcpv6.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.services.dhcpv6.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.services.dhcpv6.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.services.dhcpv6.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.services.dhcpv6.ports.dhcpv6 }}
      targetPort: dhcpv6
      protocol: UDP
      name: dhcpv6
  {{- if and (eq .Values.services.dhcpv6.type "NodePort") .Values.services.dhcpv6.nodePort }}
      nodePort: {{ .Values.services.dhcpv6.nodePort }}
  {{- end }}
  selector:
    {{- include "pihole.selectorLabels" . | nindent 4 }}
{{- end }}
