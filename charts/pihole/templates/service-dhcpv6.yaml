{{- if .Values.pihole.ftl.dhcp.ipv6.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pihole.fullname" . }}-dhcpv6
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.pihole.ftl.dhcp.ipv6.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.pihole.ftl.dhcp.ipv6.service.type }}
  {{- if or (eq .Values.pihole.ftl.dhcp.ipv6.service.type "LoadBalancer") (eq .Values.pihole.ftl.dhcp.ipv6.service.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.pihole.ftl.dhcp.ipv6.service.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.pihole.ftl.dhcp.ipv6.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.pihole.ftl.dhcp.ipv6.service.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.pihole.ftl.dhcp.ipv6.service.ports.dhcpv6 }}
      targetPort: dhcpv6
      protocol: UDP
      name: dhcpv6
  {{- if and (eq .Values.pihole.ftl.dhcp.ipv6.service.type "NodePort") .Values.pihole.ftl.dhcp.ipv6.service.nodePort }}
      nodePort: {{ .Values.pihole.ftl.dhcp.ipv6.service.nodePort }}
  {{- end }}
  selector:
    {{- include "pihole.selectorLabels" . | nindent 4 }}
{{- end }}
