{{- if .Values.services.dhcp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pihole.fullname" . }}-dhcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.services.dhcp.annotations | nindent 4 }}
spec:
  type: {{ .Values.services.dhcp.type }}
  {{- if or (eq .Values.services.dhcp.type "LoadBalancer") (eq .Values.services.dhcp.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.services.dhcp.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.services.dhcp.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.services.dhcp.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.services.dhcp.ports.dhcp }}
      targetPort: dhcp
      protocol: UDP
      name: dhcp
  {{- if and (eq .Values.services.dhcp.type "NodePort") .Values.services.dhcp.nodePort }}
      nodePort: {{ .Values.services.dhcp.nodePort }}
  {{- end }}
  selector:
    {{- include "pihole.selectorLabels" . | nindent 4 }}
{{- end }}
