{{- if .Values.serviceDhcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pihole.fullname" . }}-dhcp
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.serviceDhcp.annotations | nindent 4 }}
spec:
  type: {{ .Values.serviceDhcp.type }}
  {{- if or (eq .Values.serviceDhcp.type "LoadBalancer") (eq .Values.serviceDhcp.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.serviceDhcp.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.serviceDhcp.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.serviceDhcp.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.serviceDhcp.ports.dhcp }}
      targetPort: dhcp
      protocol: UDP
      name: dhcp
      {{- if and (eq .Values.serviceDhcp.type "NodePort") .Values.serviceDhcp.nodePort }}
      nodePort: {{ .Values.serviceDhcp.nodePort }}
      {{- end }}
  selector:
    {{- include "pihole.selectorLabels" . | nindent 4 }}
{{- end }}