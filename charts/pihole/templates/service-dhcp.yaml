{{- if .Values.pihole.ftl.dhcp.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pihole.fullname" . }}-dhcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.pihole.ftl.dhcp.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.pihole.ftl.dhcp.service.type }}
  {{- if or (eq .Values.pihole.ftl.dhcp.service.type "LoadBalancer") (eq .Values.pihole.ftl.dhcp.service.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.pihole.ftl.dhcp.service.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.pihole.ftl.dhcp.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.pihole.ftl.dhcp.service.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.pihole.ftl.dhcp.service.ports.dhcp }}
      targetPort: dhcp
      protocol: UDP
      name: dhcp
  {{- if and (eq .Values.pihole.ftl.dhcp.service.type "NodePort") .Values.pihole.ftl.dhcp.service.nodePort }}
      nodePort: {{ .Values.pihole.ftl.dhcp.service.nodePort }}
  {{- end }}
  selector:
    {{- include "pihole.selectorLabels" . | nindent 4 }}
{{- end }}
