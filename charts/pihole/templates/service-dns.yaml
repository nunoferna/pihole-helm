{{- if .Values.serviceDns.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pihole.fullname" . }}-dns
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.serviceDns.annotations | nindent 4 }}
spec:
  type: {{ .Values.serviceDns.type }}
  {{- if or (eq .Values.serviceDns.type "LoadBalancer") (eq .Values.serviceDns.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.serviceDns.externalTrafficPolicy }}
  {{- end }}
  ports:
    - port: {{ .Values.serviceDns.ports.tcp }}
      targetPort: dns-tcp
      protocol: TCP
      name: dns-tcp
    - port: {{ .Values.serviceDns.ports.udp }}
      targetPort: dns-udp
      protocol: UDP
      name: dns-udp
  selector:
    {{- include "pihole.selectorLabels" . | nindent 4 }}
{{- end }}