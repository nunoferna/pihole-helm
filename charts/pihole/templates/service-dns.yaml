{{- if and .Values.services.dns.enabled (not .Values.services.dns.splitTcpUdp) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pihole.fullname" . }}-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.services.dns.annotations | nindent 4 }}
spec:
  type: {{ .Values.services.dns.type }}
  {{- include "pihole.loadBalancerFields" .Values.services.dns | nindent 2 }}
  {{- if or (eq .Values.services.dns.type "LoadBalancer") (eq .Values.services.dns.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.services.dns.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.services.dns.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.services.dns.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.services.dns.ports.tcp }}
      targetPort: dns-tcp
      protocol: TCP
      name: dns-tcp
  {{- with (get (.Values.services.dns.nodePorts | default dict) "tcp") }}
    {{- if eq $.Values.services.dns.type "NodePort" }}
      nodePort: {{ . }}
    {{- end }}
  {{- end }}
    - port: {{ .Values.services.dns.ports.udp }}
      targetPort: dns-udp
      protocol: UDP
      name: dns-udp
  {{- with (get (.Values.services.dns.nodePorts | default dict) "udp") }}
    {{- if eq $.Values.services.dns.type "NodePort" }}
      nodePort: {{ . }}
    {{- end }}
  {{- end }}
  selector:
    {{- include "pihole.selectorLabels" . | nindent 4 }}
{{- end }}
