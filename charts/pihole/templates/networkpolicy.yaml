{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pihole.fullname" . }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pihole.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 67
          protocol: UDP
    - ports:
        - port: 80
          protocol: TCP
        - port: 9617 
          protocol: TCP
      from:
        {{- if .Values.networkPolicy.webAllowFrom }}
        {{- toYaml .Values.networkPolicy.webAllowFrom | nindent 8 }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
{{- end }}