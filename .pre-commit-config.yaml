repos:
  # 1. Format Helm Template
  - repo: https://github.com/digitalstudium/helmfmt
    rev: v0.4.3
    hooks:
      - id: helmfmt
        name: Format Helm Charts

  # 2. Lint Shell Scripts (for scripts/update-dashboard.sh)
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        files: \.sh$
  
  # 3. Auto-generate README from values.yaml comments
  - repo: https://github.com/norwoodj/helm-docs
    rev: v1.14.2
    hooks:
      - id: helm-docs
        args: ["--chart-search-root=charts"]

  # 4. Auto-generate values.schema.json
  - repo: https://github.com/losisin/helm-values-schema-json
    rev: v2.3.1
    hooks:
      - id: helm-schema
        args: 
          - "--values=charts/pihole/values.yaml"
          - "--output=charts/pihole/values.schema.json"
          - "--use-helm-docs"
  
  # 5. Standard Helm Linting (syntax check)
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: helmlint
        name: Helm Lint
        args: ["charts/pihole"]

  # 6. KubeLinter (Best practices check)
  - repo: https://github.com/stackrox/kube-linter
    rev: v0.8.2
    hooks:
      - id: kube-linter
        args: ["charts/pihole"]
        pass_filenames: false
  
  