apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pihole-staging-local
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pihole-staging-0
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pihole-staging-local
  claimRef:
    namespace: pihole-staging
    name: etc-pihole-pihole-staging-0
  local:
    path: /var/mnt/pihole-staging
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [cp01]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pihole-staging-1
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pihole-staging-local
  claimRef:
    namespace: pihole-staging
    name: etc-pihole-pihole-staging-1
  local:
    path: /var/mnt/pihole-staging
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [cp03]
